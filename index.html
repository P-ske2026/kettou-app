 /* 最新の判定結果 */

<body>

<div class="container">

       <div class="result" id="threeHoursResult" style="display:none;">

</div>

<button class="injection-complete" data-type="threeHours" style="display:none;">

</button>

    <!-- 18時 -->
<div class="item">

    <div class="fixed" id="tresibaResult">
        トレシーバ<br>
        <span class="dose-number">7単位</span>

   <button class="injection-complete" data-type="tresiba" style="display:none;">注射完了</button>

</div>

<button class="injection-complete" data-type="dinner" style="display:none;">

</button>

            入力内容を確認

       <div class="result" id="bedtimeResult" style="display:none;">
    血糖値を入力してください
</div>

<button class="injection-complete" data-type="bedtime" style="display:none;">

</button>

<script>

/* =========================
   インスリン量の計算
   ========================= */

function calculate(type, value, special = false) {

    if (value === "" || value === null) {
        return "血糖値を入力してください";
    }

    const bg = Number(value);

    if (bg < 70) {
        return "計算対象外";
    }

    let dose = 0;

    if (bg <= 249) {
        if (type === "morning") dose = 8;
        if (type === "lunch") dose = special ? 8 : 6;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 9 : 7;
        if (type === "bedtime") dose = 0;

    } else if (bg <= 299) {
        if (type === "morning") dose = 9;
        if (type === "lunch") dose = special ? 9 : 7;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 10 : 8;
        if (type === "bedtime") dose = 0;

    } else if (bg <= 349) {
        if (type === "morning") dose = 10;
        if (type === "lunch") dose = special ? 10 : 8;
        if (type === "threeHours") dose = 1;
        if (type === "dinner") dose = special ? 11 : 9;
        if (type === "bedtime") dose = 1;

    } else if (bg <= 399) {
        if (type === "morning") dose = 11;
        if (type === "lunch") dose = special ? 11 : 9;
        if (type === "threeHours") dose = 2;
        if (type === "dinner") dose = special ? 12 : 10;
        if (type === "bedtime") dose = 2;

    } else if (bg <= 449) {
        if (type === "morning") dose = 12;
        if (type === "lunch") dose = special ? 12 : 10;
        if (type === "threeHours") dose = 3;
        if (type === "dinner") dose = special ? 13 : 11;
        if (type === "bedtime") dose = 3;

    } else if (bg <= 499) {
        if (type === "morning") dose = 13;
        if (type === "lunch") dose = special ? 13 : 11;
        if (type === "threeHours") dose = 4;
        if (type === "dinner") dose = special ? 14 : 12;
        if (type === "bedtime") dose = 4;

    } else {
        if (type === "morning") dose = 14;
        if (type === "lunch") dose = special ? 14 : 12;
        if (type === "threeHours") dose = 5;
        if (type === "dinner") dose = special ? 15 : 13;
        if (type === "bedtime") dose = 5;
    }

    return dose + "単位";
}


/* =========================
   結果表示
   ========================= */

function updateAll() {

    const data = {
        morning: document.getElementById("morning").value,
        lunch: document.getElementById("lunch").value,
        threeHours: document.getElementById("threeHours").value,
        dinner: document.getElementById("dinner").value,
        bedtime: document.getElementById("bedtime").value,
        lunchSpecial: document.getElementById("lunchSpecial").checked,
        dinnerSpecial: document.getElementById("dinnerSpecial").checked
    };


    showResult(
        "morning",
        data.morning,
        false
    );

    showResult(
        "lunch",
        data.lunch,
        data.lunchSpecial
    );

    showResult(
        "threeHours",
        data.threeHours,
        false
    );

    showResult(
        "dinner",
        data.dinner,
        data.dinnerSpecial
    );

    showResult(
        "bedtime",
        data.bedtime,
        false
    );
}

function showResult(type, value, special) {

    const result =
        document.getElementById(type + "Result");

    const answer =
        calculate(type, value, special);


    if (answer === "血糖値を入力してください") {

        result.style.display = "none";
        return;
    }


    let label = "";

    if (type === "morning") {
        label = "朝のインスリン";
    }

    if (type === "lunch") {
        label = "昼のインスリン";
    }

    if (type === "threeHours") {
        label = "3時間後のインスリン";
    }

    if (type === "dinner") {
        label = "夜のインスリン";
    }

    if (type === "bedtime") {
        label = "就寝前のインスリン";
    }


    result.innerHTML =
        '<div class="result-label">' +
        label +
        '</div>' +
        '<div class="result-dose">' +
        answer +
        '</div>';

    result.style.display = "block";


    /* =========================
       朝・昼
       ========================= */

    if (type === "morning" || type === "lunch") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="' +
                type +
                '"]'
            );

        if (
            button &&
            button.dataset.completed !== "true"
        ) {
            button.style.display = "block";
        }
    }


    /* =========================
       3時間後
       1単位以上なら完了ボタン
       ========================= */

    if (type === "threeHours") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="threeHours"]'
            );

        const doseElement =
            result.querySelector(".result-dose");

        if (
            button &&
            doseElement &&
            button.dataset.completed !== "true"
        ) {

            const dose =
                parseInt(
                    doseElement.textContent.trim(),
                    10
                );

            if (dose >= 1) {
                button.style.display = "block";
            } else {
                button.style.display = "none";
            }
        }
    }

    /* =========================
       夜
       1単位以上なら完了ボタン
       ========================= */

    if (type === "dinner") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="dinner"]'
            );

        const doseElement =
            result.querySelector(".result-dose");

        if (
            button &&
            doseElement &&
            button.dataset.completed !== "true"
        ) {

            const dose =
                parseInt(
                    doseElement.textContent.trim(),
                    10
                );

            if (dose >= 1) {
                button.style.display = "block";
            }
        }
    }


    /* =========================
       就寝前
       1単位以上なら完了ボタン
       ========================= */

    if (type === "bedtime") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="bedtime"]'
            );

        const doseElement =
            result.querySelector(".result-dose");

        if (
            button &&
            doseElement &&
            button.dataset.completed !== "true"
        ) {

            const dose =
                parseInt(
                    doseElement.textContent.trim(),
                    10
                );

            if (dose >= 1) {
                button.style.display = "block";
            }
        }
       
    }

}
/* =========================
   最新の結果を赤字にする
   ========================= */

function setLatestResult(type) {

    document.querySelectorAll(".result").forEach(function(result) {
        result.classList.remove("latest-result");
    });


    if (!type) {
        return;
    }


    const result =
        document.getElementById(type + "Result");

    if (result) {
        result.classList.add("latest-result");
    }
}


/* =========================
   データ保存
   ========================= */

const STORAGE_KEY = "bloodSugarData";
const LATEST_KEY = "latestBloodSugarResult";
const COMPLETED_KEY = "completedSteps";

function getCompletedSteps() {
    try {
        return JSON.parse(localStorage.getItem(COMPLETED_KEY)) || {};
    } catch (e) {
        return {};
    }
}

function saveCompletedStep(type) {
    const completed = getCompletedSteps();
    completed[type] = true;
    localStorage.setItem(COMPLETED_KEY, JSON.stringify(completed));
}

function applyCompletedState() {
    const completed = getCompletedSteps();

    document.querySelectorAll(".injection-complete").forEach(function(button) {
        const type = button.dataset.type;
        if (completed[type]) {
            button.dataset.completed = "true";
            button.style.display = "none";
        }
    });

    Object.keys(completed).forEach(function(type) {
        if (!completed[type]) return;
        const input = document.getElementById(type);
        if (input) {
            input.disabled = true;
            const item = input.closest(".item");
            const confirmButton = item ? item.querySelector(".confirm-button") : null;
            if (confirmButton) confirmButton.disabled = true;
        }
    });
}
/* =========================
   LINE通知
   ========================= */

async function sendLineNotification(data) {

    try {

        const response = await fetch(
            "https://kettou-line.yts-bloom-style.workers.dev/notify",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );

        if (!response.ok) {

            console.error(
                "LINE通知エラー:",
                await response.text()
            );

            return false;
        }

        console.log("LINE通知送信成功");

        return true;

    } catch (error) {

        console.error(
            "LINE通知通信エラー:",
            error
        );

        return false;
    }
}
/* =========================
   インスリン量を取得
   ========================= */

function getDose(type) {

    const result =
        document.getElementById(type + "Result");

    if (!result) {
        return null;
    }

    const doseElement =
        result.querySelector(".result-dose");

    if (!doseElement) {
        return null;
    }

    const match =
        doseElement.textContent.match(/\d+/);

    if (!match) {
        return null;
    }

    return Number(match[0]);
}
 /* =========================
    1日分のLINE通知データ
    ========================= */

function buildDailySummaryPayload() {

    return {

        type: "dailySummary",

        morning: {
            bg: document.getElementById("morning").value,
            dose: getDose("morning")
        },

        lunch: {
            bg: document.getElementById("lunch").value,
            dose: getDose("lunch"),
            special: document.getElementById("lunchSpecial").checked
        },

        threeHours: {
            bg: document.getElementById("threeHours").value,
            dose: getDose("threeHours")
        },

        dinner: {
            bg: document.getElementById("dinner").value,
            dose: getDose("dinner"),
            special: document.getElementById("dinnerSpecial").checked
        },

        bedtime: {
            bg: document.getElementById("bedtime").value,
            dose: getDose("bedtime")
        }
    };
}
   function getToday() {

    const now = new Date();

    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
}


function saveData() {

    const data = {

        date: getToday(),

        morning:
            document.getElementById("morning").value,

        lunch:
            document.getElementById("lunch").value,

        threeHours:
            document.getElementById("threeHours").value,

        dinner:
            document.getElementById("dinner").value,

        bedtime:
            document.getElementById("bedtime").value,

        lunchSpecial:
            document.getElementById("lunchSpecial").checked,

        dinnerSpecial:
            document.getElementById("dinnerSpecial").checked
    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================
   今日のデータを復元
   ========================= */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);


    if (!saved) {
        return;
    }


    const data =
        JSON.parse(saved);


    /* 日付が変わっていたらリセット */

    if (data.date !== getToday()) {

        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LATEST_KEY);
        localStorage.removeItem(COMPLETED_KEY);
        localStorage.removeItem("tresibaTransitionDate");

        document.getElementById("morning").value = "";
        document.getElementById("lunch").value = "";
        document.getElementById("threeHours").value = "";
        document.getElementById("dinner").value = "";
        document.getElementById("bedtime").value = "";

        document.getElementById("lunchSpecial").checked = false;
        document.getElementById("dinnerSpecial").checked = false;

        return;
    }


    /* 今日なら復元 */

    document.getElementById("morning").value =
        data.morning || "";

    document.getElementById("lunch").value =
        data.lunch || "";

    document.getElementById("threeHours").value =
        data.threeHours || "";

    document.getElementById("dinner").value =
        data.dinner || "";

    document.getElementById("bedtime").value =
        data.bedtime || "";

    document.getElementById("lunchSpecial").checked =
        data.lunchSpecial || false;

    document.getElementById("dinnerSpecial").checked =
        data.dinnerSpecial || false;


    updateAll();


    /* 最後に判定した時間帯を赤字にする */

    const latest =
        localStorage.getItem(LATEST_KEY);

    setLatestResult(latest);
    applyCompletedState();
}


/* =========================
   入力内容の確認
   ========================= */

document.querySelectorAll(".confirm-button").forEach(function(button) {

    button.addEventListener("click", function() {

        const confirmation =
            document.getElementById("confirmation");


        /* 押した時間帯を判定 */

        const currentItem =
            button.closest(".item");

        let currentType = "";


        if (currentItem.querySelector("#morning")) {
            currentType = "morning";

        } else if (currentItem.querySelector("#lunch")) {
            currentType = "lunch";

        } else if (currentItem.querySelector("#threeHours")) {
            currentType = "threeHours";

        } else if (currentItem.querySelector("#dinner")) {
            currentType = "dinner";

        } else if (currentItem.querySelector("#bedtime")) {
            currentType = "bedtime";
        }


        confirmation.dataset.currentType =
            currentType;


        /* 入力値を取得 */

        const morning =
            document.getElementById("morning").value;

        const lunch =
            document.getElementById("lunch").value;

        const threeHours =
            document.getElementById("threeHours").value;

        const dinner =
            document.getElementById("dinner").value;

        const bedtime =
            document.getElementById("bedtime").value;

        const lunchSpecial =
            document.getElementById("lunchSpecial").checked;

        const dinnerSpecial =
            document.getElementById("dinnerSpecial").checked;


        /* 確認画面の文章 */

        let text = "";


        text +=
            '<div class="confirmation-line">朝：' +
            (morning === "" ?
                "未入力" :
                morning + " mg/dL") +
            '</div>';


        text +=
            '<div class="confirmation-line">昼：' +
            (lunch === "" ?
                "未入力" :
                lunch + " mg/dL") +
            (lunchSpecial ?
                "（外食・丼・揚げ物）" :
                "") +
            '</div>';


        text +=
            '<div class="confirmation-line">3時間後：' +
            (threeHours === "" ?
                "未入力" :
                threeHours + " mg/dL") +
            '</div>';


      text +=
    '<div class="confirmation-line">' +
    '18時：トレシーバ 7単位' +
    '</div>';


        text +=
            '<div class="confirmation-line">夜：' +
            (dinner === "" ?
                "未入力" :
                dinner + " mg/dL") +
            (dinnerSpecial ?
                "（外食・丼・揚げ物）" :
                "") +
            '</div>';


        text +=
            '<div class="confirmation-line">就寝前：' +
            (bedtime === "" ?
                "未入力" :
                bedtime + " mg/dL") +
            '</div>';


        document.getElementById(
            "confirmationText"
        ).innerHTML = text;


        /* 確認画面を押したボタンの直後へ移動 */

        button.parentNode.insertBefore(
            confirmation,
            button.nextSibling
        );


        confirmation.style.display = "block";


        confirmation.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    });

});
document.querySelectorAll(".injection-complete").forEach(function(button) {

    button.addEventListener("click", async function() {
        const type =
            button.dataset.type;

        const result =
            document.getElementById(type + "Result");


        /* 現在の結果を黒字にする */

        if (result) {
            result.classList.remove("latest-result");
        }


        /* ボタンを消して、完了済みにする */

        button.style.display = "none";
        button.dataset.completed = "true";
        saveCompletedStep(type);

        const completedInput = document.getElementById(type);
        if (completedInput) {
            completedInput.disabled = true;
            const completedItem = completedInput.closest(".item");
            const completedConfirmButton = completedItem ? completedItem.querySelector(".confirm-button") : null;
            if (completedConfirmButton) completedConfirmButton.disabled = true;
        }


        /* =========================
           朝 → 昼
           ========================= */

        if (type === "morning") {
sendLineNotification({
    type: "morning",
    bg: document.getElementById("morning").value,
    dose: getDose("morning")
});
            const lunch =
                document.getElementById("lunch");

            if (lunch) {
                lunch.focus();
                lunch.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }

        }


        /* =========================
           昼 → 3時間後
           ========================= */

        else if (type === "lunch") {
sendLineNotification({
    type: "lunch",
    bg: document.getElementById("lunch").value,
    dose: getDose("lunch"),
    special: document.getElementById("lunchSpecial").checked
});
            const threeHours =
                document.getElementById("threeHours");

            if (threeHours) {
                threeHours.focus();
                threeHours.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }

        }


        /* =========================
           3時間後 → トレシーバ
           ========================= */

        else if (type === "threeHours") {
sendLineNotification({
    type: "threeHours",
    bg: document.getElementById("threeHours").value,
    dose: getDose("threeHours")
});
            const threeHoursResult =
                document.getElementById("threeHoursResult");

            const tresibaResult =
                document.getElementById("tresibaResult");


            /* 3時間後を黒字にする */

            if (threeHoursResult) {
                threeHoursResult.classList.remove(
                    "latest-result"
                );
            }


            /* トレシーバを赤字にする */

            if (tresibaResult) {
                tresibaResult.classList.add(
                    "latest-result"
                );
            }


            /* 3時間後の時間判定を終了 */

            localStorage.removeItem(
                "threeHoursJudgedAt"
            );


            /* トレシーバの完了ボタンを表示 */

            const tresibaButton =
                document.querySelector(
                    '.injection-complete[data-type="tresiba"]'
                );

            if (tresibaButton) {
                tresibaButton.style.display = "block";
            }


            /* トレシーバへ移動 */

            if (tresibaResult) {
                tresibaResult.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }

        }


        /* =========================
           トレシーバ → 夜
           ========================= */

        else if (type === "tresiba") {
sendLineNotification({
    type: "tresiba"
});
            const tresibaResult =
                document.getElementById("tresibaResult");


            /* トレシーバを黒字にする */

            if (tresibaResult) {
                tresibaResult.classList.remove(
                    "latest-result"
                );
            }


            /* 夜へ移動 */

            const dinner =
                document.getElementById("dinner");

            if (dinner) {
                dinner.focus();
                dinner.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }

        }


        /* =========================
           夜 → 就寝前
           ========================= */

        else if (type === "dinner") {
sendLineNotification({
    type: "dinner",
    bg: document.getElementById("dinner").value,
    dose: getDose("dinner"),
    special: document.getElementById("dinnerSpecial").checked
});
            const bedtime =
                document.getElementById("bedtime");

            if (bedtime) {
                bedtime.focus();
                bedtime.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }

        }


        /* =========================
           就寝前 → 1日終了
           ========================= */

        else if (type === "bedtime") {
   await sendLineNotification(
        buildDailySummaryPayload()
    );
            /* 今日のデータは日付が変わるまで保持する */

            /* ページを再読み込み */

            location.reload();

        }

    });

});


/* =========================
   戻って修正する
   ========================= */

document.getElementById("backButton").addEventListener(
    "click",
    function() {

        document.getElementById(
            "confirmation"
        ).style.display = "none";

    }
);


/* =========================
   この内容で判定する
   ========================= */

document.getElementById("calculateButton").addEventListener(
    "click",
    function() {

        const confirmation =
            document.getElementById("confirmation");


        const currentType =
            confirmation.dataset.currentType;


       updateAll();



/* 最新の時間帯を赤字にする */

        setLatestResult(currentType);


        /* 最新の時間帯を保存 */

        localStorage.setItem(
            LATEST_KEY,
            currentType
        );

        if (currentType === "threeHours") {
            const dose = getDose("threeHours");

            if (dose === 0) {

                /* 0単位判定時刻を保存 */
                localStorage.setItem(
                    "threeHoursJudgedAt",
                    Date.now().toString()
                );

                /* 0単位LINEを送信 */
                sendLineNotification({
                    type: "threeHours",
                    bg: document.getElementById("threeHours").value,
                    dose: dose
                });

            } else {

                /* 1単位以上に訂正されたら猶予タイマーを解除 */
                localStorage.removeItem(
                    "threeHoursJudgedAt"
                );
            }
        }
        if (currentType === "bedtime") {
            const dose = getDose("bedtime");
            if (dose === 0) {
                sendLineNotification(buildDailySummaryPayload());
            }
        }



/* 入力内容を保存 */

        saveData();


        /* 確認画面を閉じる */

        confirmation.style.display = "none";

    }
);

function checkThreeHoursEditLock() {

    const judgedAt =
        localStorage.getItem("threeHoursJudgedAt");

    if (!judgedAt) {
        return;
    }

    const elapsed =
        Date.now() - Number(judgedAt);

    /* 2分以内なら編集可能 */
    if (elapsed < 2 * 60 * 1000) {
        return;
    }

    const input =
        document.getElementById("threeHours");

    if (input) {
        input.disabled = true;
    }

    const item =
        input ? input.closest(".item") : null;

    const confirmButton =
        item ?
        item.querySelector(".confirm-button") :
        null;

    if (confirmButton) {
        confirmButton.disabled = true;
    }
}

function checkTresibaTime() {

    const threeHoursResult =
        document.getElementById("threeHoursResult");

    const tresibaResult =
        document.querySelector("#tresibaResult");

    if (!threeHoursResult || !tresibaResult) {
        return;
    }

    const doseElement =
        threeHoursResult.querySelector(".result-dose");

    if (!doseElement || threeHoursResult.style.display === "none") {
        return;
    }

    const now = new Date();
    const minutes = now.getHours() * 60 + now.getMinutes();
    const transitionDate = localStorage.getItem("tresibaTransitionDate");
    const today = getToday();

    if (minutes < 17 * 60 + 45 || transitionDate === today) {
        return;
    }

    tresibaResult.classList.add("latest-result");
    localStorage.setItem(LATEST_KEY, "tresiba");
    localStorage.setItem("tresibaTransitionDate", today);

    const tresibaButton =
        document.querySelector('.injection-complete[data-type="tresiba"]');

    if (tresibaButton && tresibaButton.dataset.completed !== "true") {
        tresibaButton.style.display = "block";
    }

    tresibaResult.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

setInterval(function() {
    checkTresibaTime();
    checkThreeHoursEditLock();
}, 5000);

checkTresibaTime();
checkThreeHoursEditLock();

   ページを開いたとき
   ========================= */

loadData();


/* =========================
   日付が変わったら自動リセット
   ========================= */

setInterval(function() {

    const saved =
        localStorage.getItem(STORAGE_KEY);


    if (!saved) {
        return;
    }


    const data =
        JSON.parse(saved);


    if (data.date !== getToday()) {

        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LATEST_KEY);
        localStorage.removeItem(COMPLETED_KEY);
        localStorage.removeItem("tresibaTransitionDate");

        location.reload();
    }

}, 60000);
