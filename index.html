<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血糖管理</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, "Noto Sans JP", sans-serif;
        color: #222;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 15px;
    }

    h1 {
        text-align: center;
        font-size: 34px;
        margin: 10px 0 25px;
    }

    .item {
        background: white;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 18px;
        box-shadow: 0 2px 7px rgba(0,0,0,0.10);
    }

    .title {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .unit {
        font-size: 18px;
        font-weight: normal;
        margin-left: 5px;
    }

    input[type="number"] {
        width: 100%;
        height: 70px;
        font-size: 36px;
        padding: 10px 15px;
        border: 3px solid #888;
        border-radius: 12px;
        text-align: center;
    }

    input[type="number"]:focus {
        border-color: #333;
        outline: none;
    }

   .result {
    margin-top: 15px;
    padding: 12px 10px;
    text-align: center;
    background: #eeeeee;
    border-radius: 12px;
    font-size: 24px;
    font-weight: bold;
}

.result-label {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
}

.result-dose {
    font-size: 32px;
    font-weight: bold;
}

.result-label {
    font-size: 22px;
    margin-bottom: 5px;
}

.result-dose {
    font-size: 42px;
    font-weight: bold;
}

    .dose-number {
        font-size: 42px;
    }
.result-label {
    font-size: 22px;
    margin-bottom: 5px;
}

.result-dose {
    font-size: 42px;
    font-weight: bold;
}
    .check {
        margin-top: 18px;
        padding: 10px 5px;
        font-size: 24px;
        font-weight: bold;
    }

    .check input {
        width: 30px;
        height: 30px;
        vertical-align: middle;
        margin-right: 8px;
    }

    .fixed {
        background: #eeeeee;
        padding: 20px 10px;
        border-radius: 12px;
        font-size: 30px;
        text-align: center;
        font-weight: bold;
    }

    .notice {
        text-align: center;
        font-size: 18px;
        margin-top: 10px;
        color: #555;
    }

    .confirm-button {
        width: 100%;
        height: 70px;
        margin-top: 15px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 28px;
        font-weight: bold;
    }

    .confirmation {
        background: white;
        border-radius: 18px;
        padding: 20px;
        margin-top: 18px;
        box-shadow: 0 2px 7px rgba(0,0,0,0.10);
    }

    .confirmation-title {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
    }

    .confirmation-line {
        font-size: 22px;
        padding: 10px 5px;
        border-bottom: 1px solid #ddd;
    }

    .calculate-button {
        width: 100%;
        height: 65px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .back-button {
        width: 100%;
        height: 60px;
        margin-top: 12px;
        border: 2px solid #888;
        border-radius: 12px;
        background: white;
        color: #222;
        font-size: 23px;
        font-weight: bold;
    }
 /* 最新の判定結果 */
.result.latest-result {
    color: red;
}

.result.latest-result .result-dose {
    color: red;
}
</style>

</head>

<body>

<div class="container">

    <h1>今日の血糖値</h1>

    <!-- 朝 -->
    <div class="item">
        <div class="title">
            朝 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="morning" placeholder="入力" min="0" max="1000" step="1">

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="morningResult" style="display:none;">
            血糖値を入力してください
        </div>
    </div>


    <!-- 昼 -->
    <div class="item">
        <div class="title">
            昼 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="lunch" placeholder="入力" min="0" max="1000" step="1">

        <div class="check">
            <label>
                <input type="checkbox" id="lunchSpecial">
                外食・丼・揚げ物
            </label>
        </div>

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="lunchResult" style="display:none;">
            血糖値を入力してください
        </div>
    </div>


    <!-- 3時間後 -->
    <div class="item">
        <div class="title">
            3時間後 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="threeHours" placeholder="入力" min="0" max="1000" step="1">

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="threeHoursResult" style="display:none;">
            血糖値を入力してください
        </div>
    </div>


    <!-- 18時 -->
    <div class="item">
        <div class="title">18時</div>

        <div class="fixed">
            トレシーバ<br>
            <span class="dose-number">7単位</span>
        </div>
    </div>


    <!-- 夜 -->
    <div class="item">
        <div class="title">
            夜 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="dinner" placeholder="入力" min="0" max="1000" step="1">

        <div class="check">
            <label>
                <input type="checkbox" id="dinnerSpecial">
                外食・丼・揚げ物
            </label>
        </div>

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="dinnerResult" style="display:none;">
            血糖値を入力してください
        </div>
    </div>


    <!-- 就寝前 -->
    <div class="item">
        <div class="title">
            就寝前 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="bedtime" placeholder="入力" min="0" max="1000" step="1">

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="bedtimeResult" style="display:none;">
            血糖値を入力してください
        </div>
    </div>


    <div id="confirmation" class="confirmation" style="display:none;">

        <div class="confirmation-title">
            入力内容の確認
        </div>

        <div id="confirmationText"></div>

        <button id="calculateButton" class="calculate-button">
            この内容で判定する
        </button>

        <button id="backButton" class="back-button">
            戻って修正する
        </button>

    </div>

</div>

<script>

function calculate(type, value, special = false) {

    if (value === "" || value === null) {
        return "血糖値を入力してください";
    }

    const bg = Number(value);

    if (bg < 70) {
        return "計算対象外";
    }

    let dose = 0;

    if (bg <= 249) {

        if (type === "morning") dose = 8;
        if (type === "lunch") dose = special ? 8 : 6;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 9 : 7;
        if (type === "bedtime") dose = 0;

    } else if (bg <= 299) {

        if (type === "morning") dose = 9;
        if (type === "lunch") dose = special ? 9 : 7;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 10 : 8;
        if (type === "bedtime") dose = 0;

    } else if (bg <= 349) {

        if (type === "morning") dose = 10;
        if (type === "lunch") dose = special ? 10 : 8;
        if (type === "threeHours") dose = 1;
        if (type === "dinner") dose = special ? 11 : 9;
        if (type === "bedtime") dose = 1;

    } else if (bg <= 399) {

        if (type === "morning") dose = 11;
        if (type === "lunch") dose = special ? 11 : 9;
        if (type === "threeHours") dose = 2;
        if (type === "dinner") dose = special ? 12 : 10;
        if (type === "bedtime") dose = 2;

    } else if (bg <= 449) {

        if (type === "morning") dose = 12;
        if (type === "lunch") dose = special ? 12 : 10;
        if (type === "threeHours") dose = 3;
        if (type === "dinner") dose = special ? 13 : 11;
        if (type === "bedtime") dose = 3;

    } else if (bg <= 499) {

        if (type === "morning") dose = 13;
        if (type === "lunch") dose = special ? 13 : 11;
        if (type === "threeHours") dose = 4;
        if (type === "dinner") dose = special ? 14 : 12;
        if (type === "bedtime") dose = 4;

    } else {

        if (type === "morning") dose = 14;
        if (type === "lunch") dose = special ? 14 : 12;
        if (type === "threeHours") dose = 5;
        if (type === "dinner") dose = special ? 15 : 13;
        if (type === "bedtime") dose = 5;
    }

    return dose + "単位";
}


function updateAll() {
    
    const morning =
        document.getElementById("morning").value;

    const lunch =
        document.getElementById("lunch").value;

    const threeHours =
        document.getElementById("threeHours").value;

    const dinner =
        document.getElementById("dinner").value;

    const bedtime =
        document.getElementById("bedtime").value;

    const lunchSpecial =
        document.getElementById("lunchSpecial").checked;

    const dinnerSpecial =
        document.getElementById("dinnerSpecial").checked;


    const morningResult =
        document.getElementById("morningResult");

    const lunchResult =
        document.getElementById("lunchResult");

    const threeHoursResult =
        document.getElementById("threeHoursResult");

    const dinnerResult =
        document.getElementById("dinnerResult");

    const bedtimeResult =
        document.getElementById("bedtimeResult");


    /* 朝 */

    const morningAnswer =
        calculate("morning", morning);

    if (morningAnswer === "血糖値を入力してください") {
        morningResult.style.display = "none";
    } else {
        morningResult.innerHTML =
            '<div class="result-label">朝のインスリン</div>' +
            '<div class="result-dose">' +
            morningAnswer.replace("インスリン　", "") +
            '</div>';

        morningResult.style.display = "block";
    }


    /* 昼 */

    const lunchAnswer =
        calculate("lunch", lunch, lunchSpecial);

    if (lunchAnswer === "血糖値を入力してください") {
        lunchResult.style.display = "none";
    } else {
        lunchResult.innerHTML =
            '<div class="result-label">昼のインスリン</div>' +
            '<div class="result-dose">' +
            lunchAnswer.replace("インスリン　", "") +
            '</div>';

        lunchResult.style.display = "block";
    }


    /* 3時間後 */

    const threeHoursAnswer =
        calculate("threeHours", threeHours);

    if (threeHoursAnswer === "血糖値を入力してください") {
        threeHoursResult.style.display = "none";
    } else {
        threeHoursResult.innerHTML =
            '<div class="result-label">3時間後のインスリン</div>' +
            '<div class="result-dose">' +
            threeHoursAnswer.replace("インスリン　", "") +
            '</div>';

        threeHoursResult.style.display = "block";
    }


    /* 夜 */

    const dinnerAnswer =
        calculate("dinner", dinner, dinnerSpecial);

    if (dinnerAnswer === "血糖値を入力してください") {
        dinnerResult.style.display = "none";
    } else {
        dinnerResult.innerHTML =
            '<div class="result-label">夜のインスリン</div>' +
            '<div class="result-dose">' +
            dinnerAnswer.replace("インスリン　", "") +
            '</div>';

        dinnerResult.style.display = "block";
    }


    /* 就寝前 */

    const bedtimeAnswer =
        calculate("bedtime", bedtime);

    if (bedtimeAnswer === "血糖値を入力してください") {
        bedtimeResult.style.display = "none";
    } else {
        bedtimeResult.innerHTML =
            '<div class="result-label">就寝前のインスリン</div>' +
            '<div class="result-dose">' +
            bedtimeAnswer.replace("インスリン　", "") +
            '</div>';

        bedtimeResult.style.display = "block";
  
    }
}

/* =========================
   入力内容を確認
   ========================= */

document.querySelectorAll(".confirm-button").forEach(function(button) {

    button.addEventListener("click", function() {

        const confirmation =
            document.getElementById("confirmation");

        /* どの時間帯の確認ボタンを押したか記録 */

        const currentItem = button.closest(".item");

        let currentType = "";

        if (currentItem.querySelector("#morning")) {
            currentType = "morning";
        } else if (currentItem.querySelector("#lunch")) {
            currentType = "lunch";
        } else if (currentItem.querySelector("#threeHours")) {
            currentType = "threeHours";
        } else if (currentItem.querySelector("#dinner")) {
            currentType = "dinner";
        } else if (currentItem.querySelector("#bedtime")) {
            currentType = "bedtime";
        }

        confirmation.dataset.currentType = currentType;


        /* 入力値を取得 */

        const morning =
            document.getElementById("morning").value;

        const lunch =
            document.getElementById("lunch").value;

        const threeHours =
            document.getElementById("threeHours").value;

        const dinner =
            document.getElementById("dinner").value;

        const bedtime =
            document.getElementById("bedtime").value;

        const lunchSpecial =
            document.getElementById("lunchSpecial").checked;

        const dinnerSpecial =
            document.getElementById("dinnerSpecial").checked;


        /* 確認画面の内容 */

        let text = "";

        text += '<div class="confirmation-line">朝：' +
            (morning === "" ? "未入力" : morning + " mg/dL") +
            '</div>';

        text += '<div class="confirmation-line">昼：' +
            (lunch === "" ? "未入力" : lunch + " mg/dL") +
            (lunchSpecial ? "（外食・丼・揚げ物）" : "") +
            '</div>';

        text += '<div class="confirmation-line">3時間後：' +
            (threeHours === "" ? "未入力" : threeHours + " mg/dL") +
            '</div>';

        text += '<div class="confirmation-line">18時：トレシーバ 7単位</div>';

        text += '<div class="confirmation-line">夜：' +
            (dinner === "" ? "未入力" : dinner + " mg/dL") +
            (dinnerSpecial ? "（外食・丼・揚げ物）" : "") +
            '</div>';

        text += '<div class="confirmation-line">就寝前：' +
            (bedtime === "" ? "未入力" : bedtime + " mg/dL") +
            '</div>';


        document.getElementById("confirmationText").innerHTML =
            text;


        /* 確認画面を押したボタンの直後に移動 */

        button.parentNode.insertBefore(
            confirmation,
            button.nextSibling
        );

        confirmation.style.display = "block";

        confirmation.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    });

});

/* =========================
   戻って修正する
   ========================= */

document.getElementById("backButton").addEventListener("click", function() {

    document.getElementById("confirmation").style.display = "none";

});


/* =========================
   この内容で判定する
   ========================= */

document.getElementById("calculateButton").addEventListener("click", function() {

    const confirmation =
        document.getElementById("confirmation");

    const currentType =
        confirmation.dataset.currentType;


    /* 判定結果を更新 */

    updateAll();


    /* すべての結果をいったん黒に戻す */

    document.querySelectorAll(".result").forEach(function(result) {
        result.classList.remove("latest-result");
    });


    /* 今回判定した結果だけ赤くする */

    const latestResult =
        document.getElementById(currentType + "Result");

    if (latestResult) {
        latestResult.classList.add("latest-result");
    }


    /* 確認画面を閉じる */

    confirmation.style.display = "none";

});

   
/* =========================
   入力内容を日付ごとに保存
   ========================= */

const STORAGE_KEY = "bloodSugarData";


/* 今日の日付を YYYY-MM-DD で取得 */

function getToday() {

    const now = new Date();

    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
}


/* =========================
   入力内容を保存
   ========================= */

function saveData() {

    const data = {

        date: getToday(),

        morning:
            document.getElementById("morning").value,

        lunch:
            document.getElementById("lunch").value,

        threeHours:
            document.getElementById("threeHours").value,

        dinner:
            document.getElementById("dinner").value,

        bedtime:
            document.getElementById("bedtime").value,

        lunchSpecial:
            document.getElementById("lunchSpecial").checked,

        dinnerSpecial:
            document.getElementById("dinnerSpecial").checked
    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================
   今日の入力内容を復元
   ========================= */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        return;
    }


    const data =
        JSON.parse(saved);


    /* 保存された日付と今日の日付を比較 */

    if (data.date !== getToday()) {

        localStorage.removeItem(STORAGE_KEY);

        document.getElementById("morning").value = "";
        document.getElementById("lunch").value = "";
        document.getElementById("threeHours").value = "";
        document.getElementById("dinner").value = "";
        document.getElementById("bedtime").value = "";

        document.getElementById("lunchSpecial").checked = false;
        document.getElementById("dinnerSpecial").checked = false;

        return;
    }


    /* 今日なら入力内容を復元 */

    document.getElementById("morning").value =
        data.morning || "";

    document.getElementById("lunch").value =
        data.lunch || "";

    document.getElementById("threeHours").value =
        data.threeHours || "";

    document.getElementById("dinner").value =
        data.dinner || "";

    document.getElementById("bedtime").value =
        data.bedtime || "";

    document.getElementById("lunchSpecial").checked =
        data.lunchSpecial || false;

    document.getElementById("dinnerSpecial").checked =
        data.dinnerSpecial || false;


    /* 保存されていた入力から結果も再表示 */

    updateAll();

    /* 最新の判定結果を赤字にする */

    const latestResult =
        localStorage.getItem("latestBloodSugarResult");

    document.querySelectorAll(".result").forEach(function(result) {
        result.classList.remove("latest-result");
    });

    if (latestResult) {

        const resultElement =
            document.getElementById(latestResult + "Result");

        if (resultElement) {
            resultElement.classList.add("latest-result");
        }

    }
}


/* =========================
   数値入力時に自動保存
   ========================= */

document.querySelectorAll('input[type="number"]').forEach(function(input) {

    input.addEventListener("input", function() {

        saveData();

    });

});


/* =========================
   チェックボックス変更時に保存
   ========================= */

document.getElementById("lunchSpecial").addEventListener(
    "change",
    saveData
);

document.getElementById("dinnerSpecial").addEventListener(
    "change",
    saveData
);


/* =========================
   ページを開いたときに復元
   ========================= */

loadData();


/* =========================
   日付が変わったら自動リセット
   ========================= */

setInterval(function() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        return;
    }


    const data =
        JSON.parse(saved);


    if (data.date !== getToday()) {

        localStorage.removeItem(STORAGE_KEY);

        location.reload();

    }

}, 60000);
</script>


</body>
</html>
