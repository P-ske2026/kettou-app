<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血糖管理</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f2; font-family: Arial, "Noto Sans JP", sans-serif; color: #222; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    h1 { text-align: center; font-size: 34px; margin: 10px 0 25px; }
    .item { background: white; border-radius: 18px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 7px rgba(0,0,0,0.10); }
    .title { font-size: 30px; font-weight: bold; margin-bottom: 12px; }
    .unit { font-size: 18px; font-weight: normal; margin-left: 5px; }
    input[type="number"] { width: 100%; height: 70px; font-size: 36px; padding: 10px 15px; border: 3px solid #888; border-radius: 12px; text-align: center; }
    input[type="number"]:focus { border-color: #333; outline: none; }
    .result { margin-top: 15px; padding: 12px 10px; text-align: center; background: #eeeeee; border-radius: 12px; font-size: 24px; font-weight: bold; }
    .result-label { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .result-dose { font-size: 32px; font-weight: bold; }
    .result-label { font-size: 22px; margin-bottom: 5px; }
    .result-dose { font-size: 42px; font-weight: bold; }
    .dose-number { font-size: 42px; }
    .result-label { font-size: 22px; margin-bottom: 5px; }
    .result-dose { font-size: 42px; font-weight: bold; }
    .check { margin-top: 18px; padding: 10px 5px; font-size: 24px; font-weight: bold; }
    .check input { width: 30px; height: 30px; vertical-align: middle; margin-right: 8px; }
    .fixed { background: #eeeeee; padding: 20px 10px; border-radius: 12px; font-size: 30px; text-align: center; font-weight: bold; }
    .notice { text-align: center; font-size: 18px; margin-top: 10px; color: #555; }
    .confirm-button { width: 100%; height: 70px; margin-top: 15px; border: none; border-radius: 12px; background: #333; color: white; font-size: 28px; font-weight: bold; }
    .injection-complete { width: 33%; min-width: 150px; height: 110px; margin-top: 15px; margin-left: auto; margin-right: auto; display: block; border: none; border-radius: 12px; background: #2e8b57; color: white; font-size: 28px; font-weight: bold; }
    .confirmation { background: white; border-radius: 18px; padding: 20px; margin-top: 18px; box-shadow: 0 2px 7px rgba(0,0,0,0.10); }
    .confirmation-title { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 20px; }
    .confirmation-line { font-size: 22px; padding: 10px 5px; border-bottom: 1px solid #ddd; }
    .calculate-button { width: 100%; height: 65px; margin-top: 20px; border: none; border-radius: 12px; background: #333; color: white; font-size: 25px; font-weight: bold; }
    .back-button { width: 100%; height: 60px; margin-top: 12px; border: 2px solid #888; border-radius: 12px; background: white; color: #222; font-size: 23px; font-weight: bold; }
    .result.latest-result { color: red; }
    .result.latest-result .result-dose { color: red; }
    .fixed.latest-result { color: red; }
    .fixed.latest-result .dose-number { color: red; }
    .state-warning { display:none; margin: 12px 0 18px; padding: 16px; border: 2px solid #b42318; border-radius: 12px; background:#fff1f0; color:#8a1c13; font-size:18px; font-weight:bold; line-height:1.5; }
</style>
</head>
<body>
<div class="container">
    <h1>今日の血糖値</h1>
    <div id="stateWarning" class="state-warning" role="alert"></div>
    <button id="recoverSendLockButton" type="button" style="display:none;width:100%;min-height:58px;margin:0 0 18px;border:2px solid #9a6700;border-radius:10px;background:#fff8e6;color:#674d00;font-size:18px;font-weight:bold;">
        LINE受信状況を確認して送信ロックを解除
    </button>
    <div class="item">
        <div class="title">朝 <span class="unit">血糖値（mg/dL）</span></div>
        <input type="number" id="morning" placeholder="入力" min="0" max="1000" step="1">
        <button class="confirm-button">入力内容を確認</button>
        <div class="result" id="morningResult" style="display:none;">血糖値を入力してください</div>
    </div>
    <button class="injection-complete" data-type="morning" style="display:none;" onclick="completeInjection('morning')">注射完了</button>
    <div class="item">
        <div class="title">昼 <span class="unit">血糖値（mg/dL）</span></div>
        <input type="number" id="lunch" placeholder="入力" min="0" max="1000" step="1">
        <div class="check"><label><input type="checkbox" id="lunchSpecial">外食・丼・揚げ物</label></div>
        <button class="confirm-button">入力内容を確認</button>
        <div class="result" id="lunchResult" style="display:none;">血糖値を入力してください</div>
        <button class="injection-complete" data-type="lunch" style="display:none;" onclick="completeInjection('lunch')">注射完了</button>
    </div>
    <div class="item">
        <div class="title">3時間後 <span class="unit">血糖値（mg/dL）</span></div>
        <input type="number" id="threeHours" placeholder="入力" min="0" max="1000" step="1">
        <button class="confirm-button">入力内容を確認</button>
        <div class="result" id="threeHoursResult" style="display:none;">血糖値を入力してください</div>
        <button class="injection-complete" data-type="threeHours" style="display:none;" onclick="completeInjection('threeHours')">注射完了</button>
    </div>
    <div class="item">
        <div class="title">18時</div>
        <div class="fixed" id="tresibaResult">トレシーバ<br><span class="dose-number">8単位</span></div>
        <button class="injection-complete" data-type="tresiba" style="display:none;" onclick="completeInjection('tresiba')">注射完了</button>
    </div>
    <div class="item">
        <div class="title">夜 <span class="unit">血糖値（mg/dL）</span></div>
        <input type="number" id="dinner" placeholder="入力" min="0" max="1000" step="1">
        <div class="check"><label><input type="checkbox" id="dinnerSpecial">外食・丼・揚げ物</label></div>
        <button class="confirm-button">入力内容を確認</button>
        <div class="result" id="dinnerResult" style="display:none;">血糖値を入力してください</div>
        <button class="injection-complete" data-type="dinner" style="display:none;" onclick="completeInjection('dinner')">注射完了</button>
    </div>
    <div class="item">
        <div class="title">就寝前 <span class="unit">血糖値（mg/dL）</span></div>
        <input type="number" id="bedtime" placeholder="入力" min="0" max="1000" step="1">
        <button class="confirm-button">入力内容を確認</button>
        <div class="result" id="bedtimeResult" style="display:none;">血糖値を入力してください</div>
        <button class="injection-complete" data-type="bedtime" style="display:none;" onclick="completeInjection('bedtime')">注射完了</button>
    </div>
    <div id="confirmation" class="confirmation" style="display:none;">
        <div class="confirmation-title">入力内容の確認</div>
        <div id="confirmationText"></div>
        <button id="calculateButton" class="calculate-button">この内容で判定する</button>
        <button id="backButton" class="back-button">戻って修正する</button>
    </div>
</div>
<script>
/* =========================
   インスリン量の計算
   ========================= */
function calculate(type, value, special = false) {
    if (value === "" || value === null) return "血糖値を入力してください";
    const bg = Number(value);
    if (!Number.isFinite(bg) || !Number.isInteger(bg) || bg < 0 || bg > 1000) {
        return "入力値を確認してください";
    }
    if (bg < 70) return "計算対象外";
    let dose = 0;
    if (bg <= 249) {
        if (type === "morning") dose = 8;
        if (type === "lunch") dose = special ? 8 : 6;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 9 : 7;
        if (type === "bedtime") dose = 0;
    } else if (bg <= 299) {
        if (type === "morning") dose = 9;
        if (type === "lunch") dose = special ? 9 : 7;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 10 : 8;
        if (type === "bedtime") dose = 0;
    } else if (bg <= 349) {
        if (type === "morning") dose = 10;
        if (type === "lunch") dose = special ? 10 : 8;
        if (type === "threeHours") dose = 1;
        if (type === "dinner") dose = special ? 11 : 9;
        if (type === "bedtime") dose = 1;
    } else if (bg <= 399) {
        if (type === "morning") dose = 11;
        if (type === "lunch") dose = special ? 11 : 9;
        if (type === "threeHours") dose = 2;
        if (type === "dinner") dose = special ? 12 : 10;
        if (type === "bedtime") dose = 2;
    } else if (bg <= 449) {
        if (type === "morning") dose = 12;
        if (type === "lunch") dose = special ? 12 : 10;
        if (type === "threeHours") dose = 3;
        if (type === "dinner") dose = special ? 13 : 11;
        if (type === "bedtime") dose = 3;
    } else if (bg <= 499) {
        if (type === "morning") dose = 13;
        if (type === "lunch") dose = special ? 13 : 11;
        if (type === "threeHours") dose = 4;
        if (type === "dinner") dose = special ? 14 : 12;
        if (type === "bedtime") dose = 4;
    } else {
        if (type === "morning") dose = 14;
        if (type === "lunch") dose = special ? 14 : 12;
        if (type === "threeHours") dose = 5;
        if (type === "dinner") dose = special ? 15 : 13;
        if (type === "bedtime") dose = 5;
    }
    return dose + "単位";
}
/* ========================= 結果表示 ========================= */
function applyThreeHoursTimeAdjustment() {
    const input = document.getElementById("threeHours");
    const result = document.getElementById("threeHoursResult");
    if (!input || !result || result.style.display === "none") return;
    const completed = getCompletedSteps();
    const savedJudgement = getJudgedInputs().threeHours;
    const doseElement = result.querySelector(".result-dose");
    if (!doseElement) return;

    // 完了済みなら、判定時に保存した実際の判定値を維持する。
    if (completed.threeHours === true && savedJudgement && savedJudgement.value === input.value && Number.isInteger(savedJudgement.dose)) {
        doseElement.textContent = savedJudgement.dose + "単位";
        return;
    }

    const bg = Number(input.value);
    if (input.value.trim() === "" || !Number.isInteger(bg) || bg < 70 || bg > 1000) return;
    const now = new Date();
    const minutes = now.getHours() * 60 + now.getMinutes();
    const baseAnswer = calculate("threeHours", input.value, false);
    const baseMatch = typeof baseAnswer === "string" ? baseAnswer.match(/^(\d+)単位$/) : null;
    if (!baseMatch) return;
    const requiredDose = minutes >= 16 * 60 + 30 ? (bg >= 450 ? 1 : 0) : Number(baseMatch[1]);

    // 判定済みの未完了入力が16:30をまたいで単位変更となった場合、古い判定を使わせない。
    if (savedJudgement && savedJudgement.value === input.value &&
        Number.isInteger(savedJudgement.dose) && savedJudgement.dose !== requiredDose) {
        result.style.display = "none";
        const button = document.querySelector('.injection-complete[data-type="threeHours"]');
        if (button && button.dataset.completed !== "true") button.style.display = "none";
        localStorage.removeItem("threeHoursJudgedAt");
        return;
    }

    if (minutes >= 16 * 60 + 30) {
        doseElement.textContent = requiredDose + "単位";
        const button = document.querySelector('.injection-complete[data-type="threeHours"]');
        if (button && button.dataset.completed !== "true" && requiredDose === 0) button.style.display = "none";
    }
}

function updateAll() {
    const data = {
        morning: document.getElementById("morning").value,
        lunch: document.getElementById("lunch").value,
        threeHours: document.getElementById("threeHours").value,
        dinner: document.getElementById("dinner").value,
        bedtime: document.getElementById("bedtime").value,
        lunchSpecial: document.getElementById("lunchSpecial").checked,
        dinnerSpecial: document.getElementById("dinnerSpecial").checked
    };
    showResult("morning", data.morning, false);
    showResult("lunch", data.lunch, data.lunchSpecial);
    showResult("threeHours", data.threeHours, false);
    showResult("dinner", data.dinner, data.dinnerSpecial);
    showResult("bedtime", data.bedtime, false);
    applyThreeHoursTimeAdjustment();
}
function showResult(type, value, special) {
    const result = document.getElementById(type + "Result");
    const answer = calculate(type, value, special);
    if (answer === "血糖値を入力してください") {
        result.style.display = "none";
        const button = document.querySelector('.injection-complete[data-type="' + type + '"]');
        if (button && button.dataset.completed !== "true") button.style.display = "none";
        return;
    }
    let label = "";
    if (type === "morning") label = "朝のインスリン";
    if (type === "lunch") label = "昼のインスリン";
    if (type === "threeHours") label = "3時間後のインスリン";
    if (type === "dinner") label = "夜のインスリン";
    if (type === "bedtime") label = "就寝前のインスリン";
    if (answer === "計算対象外") {
        result.innerHTML = '<div class="result-label">' + label + '</div><div class="result-dose">低血糖危険域!</div>';
        result.style.display = "block";
        const lowButton = document.querySelector('.injection-complete[data-type="' + type + '"]');
        if (lowButton && lowButton.dataset.completed !== "true") {
            lowButton.textContent = "糖分摂取完了";
            lowButton.style.display = "block";
        }
        return;
    }
    if (answer === "入力値を確認してください") {
        result.innerHTML = '<div class="result-label">' + label + '</div><div class="result-dose">入力値を確認してください</div>';
        result.style.display = "block";
        const invalidButton = document.querySelector('.injection-complete[data-type="' + type + '"]');
        if (invalidButton && invalidButton.dataset.completed !== "true") invalidButton.style.display = "none";
        return;
    }
    const normalButton = document.querySelector('.injection-complete[data-type="' + type + '"]');
    if (normalButton && normalButton.dataset.completed !== "true") normalButton.textContent = "注射完了";
    result.innerHTML = '<div class="result-label">' + label + '</div><div class="result-dose">' + answer + '</div>';
    result.style.display = "block";
    if (type === "morning" || type === "lunch") {
        const button = document.querySelector('.injection-complete[data-type="' + type + '"]');
        if (button && button.dataset.completed !== "true") button.style.display = "block";
    }
    if (type === "threeHours" || type === "dinner" || type === "bedtime") {
        const button = document.querySelector('.injection-complete[data-type="' + type + '"]');
        const doseElement = result.querySelector(".result-dose");
        if (button && doseElement && button.dataset.completed !== "true") {
            const dose = parseInt(doseElement.textContent.trim(), 10);
            if (dose >= 1) button.style.display = "block";
        }
    }
    const finalButton = document.querySelector('.injection-complete[data-type="' + type + '"]');
    if (finalButton && finalButton.dataset.completed !== "true") {
        const doseElement = result.querySelector(".result-dose");
        const match = doseElement ? doseElement.textContent.trim().match(/^(\d+)単位$/) : null;
        if (!match || Number(match[1]) === 0) finalButton.style.display = "none";
    }
}
function isLowBloodSugarResult(type) {
    const input = document.getElementById(type);
    const result = document.getElementById(type + "Result");
    if (!input || !result || result.style.display === "none") return false;
    const bg = Number(input.value);
    if (input.value.trim() === "" || !Number.isFinite(bg) || !Number.isInteger(bg) || bg < 0 || bg > 1000 || bg >= 70) return false;
    const doseElement = result.querySelector(".result-dose");
    return !!doseElement && doseElement.textContent.trim() === "低血糖危険域!";
}
function setLatestResult(type) {
    document.querySelectorAll(".result").forEach(function(result) { result.classList.remove("latest-result"); });
    if (!type) return;
    const result = document.getElementById(type + "Result");
    if (result) result.classList.add("latest-result");
}
/* ========================= データ保存 ========================= */
const STORAGE_KEY = "bloodSugarData";
const LATEST_KEY = "latestBloodSugarResult";
const COMPLETED_KEY = "completedSteps";
const SUGAR_COMPLETED_KEY = "sugarCompletedSteps";
const JUDGED_INPUTS_KEY = "judgedInputs";
const RESET_IN_PROGRESS_KEY = "dailyResetInProgress";
const THREE_HOURS_ZERO_SENDING_KEY = "threeHoursZeroSendingBg";
const BG_TYPES = ["morning", "lunch", "threeHours", "dinner", "bedtime"];
let appStateBlocked = false;

function readStorageObject(key) {
    const raw = localStorage.getItem(key);
    if (raw === null) return {};
    try {
        const value = JSON.parse(raw);
        return value && typeof value === "object" && !Array.isArray(value) ? value : null;
    } catch (error) {
        return null;
    }
}

function isValidDateKey(value) {
    if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const parts = value.split("-").map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2]);
    return date.getFullYear() === parts[0] && date.getMonth() === parts[1] - 1 && date.getDate() === parts[2];
}

function blockAppForStateProblem(message) {
    appStateBlocked = true;
    const warning = document.getElementById("stateWarning");
    if (warning) {
        warning.textContent = message;
        warning.style.display = "block";
    }
    document.querySelectorAll('input, button').forEach(function(element) {
        element.disabled = true;
    });
}

function clearDailyStateKeys() {
    [STORAGE_KEY, LATEST_KEY, COMPLETED_KEY, COMPLETION_TIMES_KEY, SUGAR_COMPLETED_KEY,
     JUDGED_INPUTS_KEY, "tresibaTransitionDate", "threeHoursZeroSentBg",
     THREE_HOURS_ZERO_SENDING_KEY, "threeHoursJudgedAt",
     "dailySummaryZeroSentBedtimeBg", "dailySummaryZeroSendingBedtimeBg",
     "bedtimeJudgedAt", "pendingBedtimeDate"].forEach(function(key) {
        localStorage.removeItem(key);
    });
}

function recoverInterruptedReset() {
    if (localStorage.getItem(RESET_IN_PROGRESS_KEY) === "true") {
        clearDailyStateKeys();
        localStorage.removeItem(RESET_IN_PROGRESS_KEY);
    }
}

function hasOrphanedDailyState() {
    const keys = [LATEST_KEY, COMPLETED_KEY, COMPLETION_TIMES_KEY, SUGAR_COMPLETED_KEY,
        JUDGED_INPUTS_KEY, "tresibaTransitionDate", "threeHoursZeroSentBg",
        THREE_HOURS_ZERO_SENDING_KEY, "threeHoursJudgedAt",
        "dailySummaryZeroSentBedtimeBg", "dailySummaryZeroSendingBedtimeBg",
        "bedtimeJudgedAt", "pendingBedtimeDate"];
    return keys.some(function(key) { return localStorage.getItem(key) !== null; });
}

function getSugarCompletedSteps() {
    return readStorageObject(SUGAR_COMPLETED_KEY) || {};
}
function setSugarCompletedStep(type, isSugarCompletion) {
    const sugarCompleted = getSugarCompletedSteps();
    if (isSugarCompletion) sugarCompleted[type] = true; else delete sugarCompleted[type];
    localStorage.setItem(SUGAR_COMPLETED_KEY, JSON.stringify(sugarCompleted));
}
function getDoseForDailySummary(type) {
    const sugarCompleted = getSugarCompletedSteps();
    if (sugarCompleted[type] === true) return "糖摂取";
    const judged = getJudgedInputs()[type];
    if (judged && isCurrentJudgedInput(type)) return judged.dose;
    return getDose(type);
}
function getCompletedSteps() {
    return readStorageObject(COMPLETED_KEY) || {};
}
function saveCompletedStep(type) {
    const completed = getCompletedSteps();
    completed[type] = true;
    localStorage.setItem(COMPLETED_KEY, JSON.stringify(completed));
}
const COMPLETION_TIMES_KEY = "completionTimes";
function getCompletionTimes() {
    return readStorageObject(COMPLETION_TIMES_KEY) || {};
}
function saveCompletionTime(type) {
    const times = getCompletionTimes();
    const completedAt = new Date().toISOString();
    times[type] = completedAt;
    localStorage.setItem(COMPLETION_TIMES_KEY, JSON.stringify(times));
    return completedAt;
}
function getJudgedInputs() {
    return readStorageObject(JUDGED_INPUTS_KEY) || {};
}

function getSpecialState(type) {
    if (type === "lunch") return document.getElementById("lunchSpecial").checked;
    if (type === "dinner") return document.getElementById("dinnerSpecial").checked;
    return false;
}

function setJudgedInput(type) {
    if (!BG_TYPES.includes(type)) return;
    const input = document.getElementById(type);
    const judged = getJudgedInputs();
    if (!input || input.value.trim() === "") {
        delete judged[type];
    } else {
        const dose = getDose(type);
        judged[type] = {
            value: input.value,
            special: getSpecialState(type),
            dose: dose,
            judgedAt: new Date().toISOString()
        };
    }
    localStorage.setItem(JUDGED_INPUTS_KEY, JSON.stringify(judged));
}

function isCurrentJudgedInput(type) {
    const input = document.getElementById(type);
    if (!input) return false;
    const judged = getJudgedInputs()[type];
    return !!judged && judged.value === input.value && judged.special === getSpecialState(type);
}

function invalidateJudgement(type) {
    if (type === "threeHours") localStorage.removeItem("threeHoursJudgedAt");
    const judged = getJudgedInputs();
    delete judged[type];
    localStorage.setItem(JUDGED_INPUTS_KEY, JSON.stringify(judged));
    const result = document.getElementById(type + "Result");
    if (result) {
        result.style.display = "none";
        result.classList.remove("latest-result");
    }
    const button = document.querySelector('.injection-complete[data-type="' + type + '"]');
    if (button && button.dataset.completed !== "true") {
        button.style.display = "none";
        button.textContent = "注射完了";
    }
    const confirmation = document.getElementById("confirmation");
    if (confirmation) confirmation.style.display = "none";
    if (localStorage.getItem(LATEST_KEY) === type) localStorage.removeItem(LATEST_KEY);
}

function applyJudgedResultVisibility() {
    const completed = getCompletedSteps();
    BG_TYPES.forEach(function(type) {
        if (completed[type] === true || isCurrentJudgedInput(type)) return;
        const result = document.getElementById(type + "Result");
        if (result) result.style.display = "none";
        const button = document.querySelector('.injection-complete[data-type="' + type + '"]');
        if (button && button.dataset.completed !== "true") button.style.display = "none";
    });
}

function completeInjection(type) {
    if (appStateBlocked || isStepCompleted(type)) return;
    const isSugarCompletion = isLowBloodSugarResult(type);
    const currentDose = type === "tresiba" ? null : getDose(type);
    if (type !== "tresiba") {
        if (!isCurrentJudgedInput(type)) {
            alert("入力値または食事条件が変更されています。もう一度確認・判定してください。");
            return;
        }
        if (isSugarCompletion) {
            if (Number(document.getElementById(type).value) >= 70) return;
        } else {
            const recalculatedDose = getCurrentDose(type);
            if (currentDose === null || recalculatedDose === null) return;
            if (currentDose !== recalculatedDose) {
                invalidateJudgement(type);
                saveData();
                alert("時間帯などの条件が変わったため、判定結果を無効にしました。もう一度判定してください。");
                return;
            }
        }
    }
    if (type !== "tresiba" && !isSugarCompletion && currentDose === null) return;
    if (type === "bedtime" && currentDose === 0) return;
    saveCompletedStep(type);
    setSugarCompletedStep(type, isSugarCompletion);

    const button = document.querySelector('.injection-complete[data-type="' + type + '"]');

    }
    if (type === "morning") {
        sendCompletionNotification({ type: "morning", bg: document.getElementById("morning").value, dose: isSugarCompletion ? "糖摂取" : getDose("morning"), completedAt: completedAt }, "朝");
        const lunch = document.getElementById("lunch");
        if (lunch) { lunch.focus(); lunch.scrollIntoView({ behavior: "smooth", block: "center" }); }
    } else if (type === "lunch") {
        sendCompletionNotification({ type: "lunch", bg: document.getElementById("lunch").value, dose: isSugarCompletion ? "糖摂取" : getDose("lunch"), special: document.getElementById("lunchSpecial").checked, completedAt: completedAt }, "昼");
        const threeHours = document.getElementById("threeHours");
        if (threeHours) { threeHours.focus(); threeHours.scrollIntoView({ behavior: "smooth", block: "center" }); }
    } else if (type === "threeHours") {
        sendCompletionNotification({ type: "threeHours", bg: document.getElementById("threeHours").value, dose: isSugarCompletion ? "糖摂取" : getDose("threeHours"), completedAt: completedAt }, "3時間後");
        const threeHoursResult = document.getElementById("threeHoursResult");
        const tresibaResult = document.getElementById("tresibaResult");
        if (threeHoursResult) threeHoursResult.classList.remove("latest-result");
        if (tresibaResult) tresibaResult.classList.add("latest-result");
        localStorage.removeItem("threeHoursJudgedAt");
        const tresibaButton = document.querySelector('.injection-complete[data-type="tresiba"]');
        if (tresibaButton) tresibaButton.style.display = "block";
        if (tresibaResult) tresibaResult.scrollIntoView({ behavior: "smooth", block: "center" });
    } else if (type === "tresiba") {
        sendCompletionNotification({ type: "tresiba", completedAt: completedAt }, "トレシーバ");
        const tresibaResult = document.getElementById("tresibaResult");
        if (tresibaResult) tresibaResult.classList.remove("latest-result");
        const dinner = document.getElementById("dinner");
        if (dinner) { dinner.focus(); dinner.scrollIntoView({ behavior: "smooth", block: "center" }); }
    } else if (type === "dinner") {
        sendCompletionNotification({ type: "dinner", bg: document.getElementById("dinner").value, dose: isSugarCompletion ? "糖摂取" : getDose("dinner"), special: document.getElementById("dinnerSpecial").checked, completedAt: completedAt }, "夜");
        const bedtime = document.getElementById("bedtime");
        if (bedtime) { bedtime.focus(); bedtime.scrollIntoView({ behavior: "smooth", block: "center" }); }
    } else if (type === "bedtime") {
        const dose = getDose("bedtime");
        if (dose >= 1 || isSugarCompletion) {
            sendLineNotification(buildDailySummaryPayload()).then(function(success) {
                if (success) finishDayAndReset();
                else {
                    const completed = getCompletedSteps();
                    completed.bedtime = false;
                    localStorage.setItem(COMPLETED_KEY, JSON.stringify(completed));
                    if (isSugarCompletion) {
                        setSugarCompletedStep("bedtime", false);
                        const times = getCompletionTimes(); delete times.bedtime;
                        localStorage.setItem(COMPLETION_TIMES_KEY, JSON.stringify(times));
                    }
                    alert("まとめLINEを送信できませんでした。通信状態を確認して、もう一度お試しください。");
                    location.reload();
                }
            });
        } else return;
    }
    applyCompletedState();
}
function isThreeHoursStageFinished() {
    const completed = getCompletedSteps();
    if (completed.threeHours === true) return true;
    const judgedAt = localStorage.getItem("threeHoursJudgedAt");
    if (!judgedAt) return false;
    const dose = getDose("threeHours");
    if (dose !== 0 || !isCurrentJudgedInput("threeHours")) return false;
    if (getCurrentDose("threeHours") !== 0) return false;
    const input = document.getElementById("threeHours");
    if (!input || localStorage.getItem("threeHoursZeroSentBg") !== input.value.trim()) return false;
    if (localStorage.getItem(THREE_HOURS_ZERO_SENDING_KEY)) return false;
    const judgedAtNumber = Number(judgedAt);
    if (!Number.isFinite(judgedAtNumber)) return false;
    return Date.now() - judgedAtNumber >= 2 * 60 * 1000;
}
function applyCompletedState() {
    if (appStateBlocked) return;
    applyJudgedResultVisibility();
    const completed = getCompletedSteps();
    const threeHoursFinished = isThreeHoursStageFinished();
    const unlocked = {
        morning: !localStorage.getItem("pendingBedtimeDate"),
        lunch: completed.morning === true,
        threeHours: completed.lunch === true,
        dinner: completed.tresiba === true,
        bedtime: completed.dinner === true
    };
    Object.keys(unlocked).forEach(function(type) {
        const input = document.getElementById(type);
        if (!input) return;
        const locked = !unlocked[type] || !!completed[type];
        input.disabled = locked;
        const item = input.closest(".item");
        const confirmButton = item ? item.querySelector(".confirm-button") : null;
        if (confirmButton) confirmButton.disabled = locked;
    });
    const lunchSpecial = document.getElementById("lunchSpecial");
    if (lunchSpecial) lunchSpecial.disabled = !unlocked.lunch || !!completed.lunch;
    const dinnerSpecial = document.getElementById("dinnerSpecial");
    if (dinnerSpecial) dinnerSpecial.disabled = !unlocked.dinner || !!completed.dinner;
    document.querySelectorAll(".injection-complete").forEach(function(button) {
        const type = button.dataset.type;
        if (completed[type]) { button.dataset.completed = "true"; button.style.display = "none"; return; }
        button.dataset.completed = "false";
        button.style.display = "none";
        if (type === "tresiba") {
            const now = new Date();
            const minutes = now.getHours() * 60 + now.getMinutes();
            if (threeHoursFinished && minutes >= 17 * 60 + 45 && unlocked.threeHours) button.style.display = "block";
            return;
        }
        if (!unlocked[type]) return;
        if (!isCurrentJudgedInput(type)) return;
        if (isLowBloodSugarResult(type)) { button.textContent = "糖分摂取完了"; button.style.display = "block"; return; }
        button.textContent = "注射完了";
        const dose = getDose(type);
        if ((type === "morning" || type === "lunch") && dose !== null) { button.style.display = "block"; return; }
        if ((type === "threeHours" || type === "dinner" || type === "bedtime") && dose !== null && dose >= 1) button.style.display = "block";
    });
}
/* ========================= LINE通知 ========================= */
async function sendLineNotification(data) {
    try {
        console.log("LINE送信データ:", data);
        const response = await fetch("https://kettou-line.yts-bloom-style.workers.dev/notify", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
        });
        if (!response.ok) { console.error("LINE通知エラー:", await response.text()); return false; }
        console.log("LINE通知送信成功");
        return true;
    } catch (error) { console.error("LINE通知通信エラー:", error); return false; }
}
function sendCompletionNotification(data, stageLabel) {
    sendLineNotification(data).then(function(success) {
        if (!success) {
            alert(stageLabel + "のLINE通知を送信できませんでした。アプリ内の完了状態は保存されています。通信状態を確認してください。");
        }
    });
}

/* ========================= インスリン量を取得 ========================= */
function getDose(type) {
    const result = document.getElementById(type + "Result");
    if (!result || result.style.display === "none") return null;
    const doseElement = result.querySelector(".result-dose");
    if (!doseElement) return null;
    const match = doseElement.textContent.match(/^(\d+)単位$/);
    if (!match) return null;
    return Number(match[1]);
}
function getCurrentDose(type) {
    const input = document.getElementById(type);
    if (!input || input.value === "") return null;
    const answer = calculate(type, input.value, getSpecialState(type));
    const match = typeof answer === "string" ? answer.match(/^(\d+)単位$/) : null;
    if (!match) return null;
    let dose = Number(match[1]);
    if (type === "threeHours") {
        const now = new Date();
        const minutes = now.getHours() * 60 + now.getMinutes();
        if (minutes >= 16 * 60 + 30) dose = Number(input.value) >= 450 ? 1 : 0;
    }
    return dose;
}
function isStepCompleted(type) { const completed = getCompletedSteps(); return completed[type] === true; }
/* ========================= 1日分のLINE通知データ ========================= */
function buildDailySummaryPayload() {
    const times = getCompletionTimes();
    return {
        type: "dailySummary",
        morning: { bg: document.getElementById("morning").value, dose: getDoseForDailySummary("morning"), completedAt: times.morning || null },
        lunch: { bg: document.getElementById("lunch").value, dose: getDoseForDailySummary("lunch"), special: document.getElementById("lunchSpecial").checked, completedAt: times.lunch || null },
        threeHours: { bg: document.getElementById("threeHours").value, dose: getDoseForDailySummary("threeHours"), completedAt: times.threeHours || null },
        tresiba: { completedAt: times.tresiba || null },
        dinner: { bg: document.getElementById("dinner").value, dose: getDoseForDailySummary("dinner"), special: document.getElementById("dinnerSpecial").checked, completedAt: times.dinner || null },

    };
}

/* ========================= 就寝前0単位のまとめLINE ========================= */
async function sendThreeHoursZeroNotification() {
    const input = document.getElementById("threeHours");
    if (!input || getCurrentDose("threeHours") !== 0 || !isCurrentJudgedInput("threeHours")) return;
    const sentKey = "threeHoursZeroSentBg";
    if (localStorage.getItem(THREE_HOURS_ZERO_SENDING_KEY)) return;
    localStorage.setItem(THREE_HOURS_ZERO_SENDING_KEY, input.value.trim());
    try {
        while (true) {
            const bg = input.value.trim();
            if (bg === "" || getCurrentDose("threeHours") !== 0 || !isCurrentJudgedInput("threeHours")) break;
            if (localStorage.getItem(sentKey) === bg) break;
            const success = await sendLineNotification({
                type: "threeHours",
                bg: bg,
                dose: 0,
                completedAt: new Date().toISOString()
            });
            if (!success) {
                alert("3時間後の0単位LINE通知を送信できませんでした。段階の自動完了は行いません。通信状態を確認して、もう一度判定してください。");
                break;
            }
            localStorage.setItem(sentKey, bg);
            if (input.value.trim() === bg && isCurrentJudgedInput("threeHours")) break;
        }
    } catch (error) {
        console.error("3時間後0単位LINE送信エラー:", error);
        alert("3時間後の0単位LINE通知でエラーが発生しました。段階の自動完了は行いません。通信状態を確認して、もう一度判定してください。");
    } finally {
        localStorage.removeItem(THREE_HOURS_ZERO_SENDING_KEY);
    }
}

async function sendDailySummaryForBedtimeZero() {
    const input = document.getElementById("bedtime");
    if (!input || input.value.trim() === "") return;
    const sentKey = "dailySummaryZeroSentBedtimeBg";
    const sendingKey = "dailySummaryZeroSendingBedtimeBg";
    const judgedAtKey = "bedtimeJudgedAt";
    const dose = getCurrentDose("bedtime");
    if (dose !== 0 || !isCurrentJudgedInput("bedtime")) {
        localStorage.removeItem(judgedAtKey);
        const times = getCompletionTimes(); delete times.bedtime;
        localStorage.setItem(COMPLETION_TIMES_KEY, JSON.stringify(times));
        return;
    }
    if (!localStorage.getItem(judgedAtKey)) {
        const judgedAt = Date.now();
        localStorage.setItem(judgedAtKey, judgedAt.toString());
        const times = getCompletionTimes();
        if (!times.bedtime) {
            times.bedtime = new Date(judgedAt).toISOString();
            localStorage.setItem(COMPLETION_TIMES_KEY, JSON.stringify(times));
        }
    }
    if (localStorage.getItem(sendingKey)) return;
    let bg = input.value.trim();
    if (localStorage.getItem(sentKey) === bg) return;
    localStorage.setItem(sendingKey, bg);
    try {
        while (true) {
            const currentBg = input.value.trim();
            const currentDose = getCurrentDose("bedtime");
            if (currentBg === "" || currentDose !== 0 || !isCurrentJudgedInput("bedtime")) break;
            if (localStorage.getItem(sentKey) === currentBg) break;
            bg = currentBg;
            const payload = buildDailySummaryPayload();
            const success = await sendLineNotification(payload);
            if (!success) {
                alert("就寝前のまとめLINEを送信できませんでした。通信状態を確認して、再度判定してください。");
                break;
            }
            localStorage.setItem(sentKey, bg);
            if (input.value.trim() !== bg) continue;
            break;
        }
    } catch (error) {
        console.error("就寝前のまとめLINE送信エラー:", error);
        alert("就寝前のまとめLINE送信中にエラーが発生しました。通信状態を確認して、再度判定してください。");
    } finally { localStorage.removeItem(sendingKey); }
}
function getToday() {
    const now = new Date();
    return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}
function saveData() {
    if (appStateBlocked) return;
    const saved = localStorage.getItem(STORAGE_KEY);
    const pendingDate = localStorage.getItem("pendingBedtimeDate");
    if (pendingDate && !isValidDateKey(pendingDate)) {
        blockAppForStateProblem("保存されている日付情報を確認できません。安全のため操作を停止しました。データを消去せず、管理者に確認してください。");
        return;
    }
    let dataDate = pendingDate || getToday();
    if (!pendingDate && saved) {
        try {
            const oldData = JSON.parse(saved);
            const completed = getCompletedSteps();
            if (oldData.date && oldData.date !== getToday() && !completed.bedtime) {
                if (!isValidDateKey(oldData.date)) {
                    blockAppForStateProblem("保存データの日付が不正です。誤った日付で前日データを上書きしないよう操作を停止しました。");
                    return;
                }
                dataDate = oldData.date;
                localStorage.setItem("pendingBedtimeDate", oldData.date);
            }
        } catch (error) { console.error("保存データの読み込みに失敗しました", error); }
    }
    const data = {
        date: dataDate,
        morning: document.getElementById("morning").value,
        lunch: document.getElementById("lunch").value,
        threeHours: document.getElementById("threeHours").value,
        dinner: document.getElementById("dinner").value,
        bedtime: document.getElementById("bedtime").value,
        lunchSpecial: document.getElementById("lunchSpecial").checked,
        dinnerSpecial: document.getElementById("dinnerSpecial").checked
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
/* ========================= 今日のデータを復元 ========================= */
function loadData() {
    recoverInterruptedReset();
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
        if (hasOrphanedDailyState()) {
            blockAppForStateProblem("血糖値データがない一方で、完了状態または通知状態が残っています。誤った段階解禁や重複注射を防ぐため操作を停止しました。保存データを自動消去せず、管理者に確認してください。");
            return;
        }
        applyCompletedState();
        return;
    }
    let data;
    try { data = JSON.parse(saved); }
    catch (error) {
        console.error("保存データの読み込みに失敗しました", error);
        blockAppForStateProblem("保存データを読み取れません。データを消去せず、管理者に確認してください。");
        return;
    }
    if (!data || typeof data !== "object" || Array.isArray(data) || !isValidDateKey(data.date)) {
        blockAppForStateProblem("保存データの日付または形式が不正です。前日データの誤処理を防ぐため操作を停止しました。");
        return;
    }
    const pendingDate = localStorage.getItem("pendingBedtimeDate");
    if (pendingDate && (!isValidDateKey(pendingDate) || pendingDate !== data.date)) {
        blockAppForStateProblem("前日データの日付情報と保存データが一致しません。安全のため操作を停止しました。");
        return;
    }
    const completed = readStorageObject(COMPLETED_KEY);
    const sugarCompleted = readStorageObject(SUGAR_COMPLETED_KEY);
    const completionTimes = readStorageObject(COMPLETION_TIMES_KEY);
    const judgedInputs = readStorageObject(JUDGED_INPUTS_KEY);
    const stageNames = ["morning", "lunch", "threeHours", "tresiba", "dinner", "bedtime"];
    const invalidCompleted = completed === null || Object.keys(completed || {}).some(function(key) {
        return stageNames.includes(key) && typeof completed[key] !== "boolean";
    });
    const invalidSugarCompleted = sugarCompleted === null || Object.keys(sugarCompleted || {}).some(function(key) {
        return stageNames.includes(key) && typeof sugarCompleted[key] !== "boolean";
    });
    const invalidTimes = completionTimes === null || Object.keys(completionTimes || {}).some(function(key) {
        return completionTimes[key] !== null && typeof completionTimes[key] !== "string";
    });
    const invalidJudgements = judgedInputs === null || Object.keys(judgedInputs || {}).some(function(key) {
        const item = judgedInputs[key];
        return !BG_TYPES.includes(key) || !item || typeof item !== "object" ||
            typeof item.value !== "string" || typeof item.special !== "boolean" ||
            !(item.dose === null || (Number.isInteger(item.dose) && item.dose >= 0)) ||
            typeof item.judgedAt !== "string";
    });
    if (invalidCompleted || invalidSugarCompleted || invalidTimes || invalidJudgements) {
        blockAppForStateProblem("完了状態・完了時刻・判定記録の保存形式が不正です。誤判定防止のため操作を停止しました。");
        return;
    }
    const inputKeys = ["morning", "lunch", "threeHours", "dinner", "bedtime"];
    const invalidInputValue = inputKeys.some(function(key) {
        const value = data[key];
        return value !== undefined && value !== null &&
            !(typeof value === "string" || (typeof value === "number" && Number.isFinite(value)));
    });
    if (invalidInputValue ||
        (data.lunchSpecial !== undefined && typeof data.lunchSpecial !== "boolean") ||
        (data.dinnerSpecial !== undefined && typeof data.dinnerSpecial !== "boolean")) {
        blockAppForStateProblem("保存された血糖値または食事条件の形式が不正です。誤った判定を防ぐため操作を停止しました。");
        return;
    }
    if (data.date > getToday()) {
        blockAppForStateProblem("保存データの日付が端末の日付より未来です。日付設定を確認するまで操作を停止しました。");
        return;
    }
    const hasBedtimeSendLock = localStorage.getItem("dailySummaryZeroSendingBedtimeBg") !== null;
    const hasThreeHoursSendLock = localStorage.getItem(THREE_HOURS_ZERO_SENDING_KEY) !== null;
    if (hasBedtimeSendLock || hasThreeHoursSendLock) {
        const warning = document.getElementById("stateWarning");
        if (warning) {
            warning.textContent = (hasBedtimeSendLock ? "就寝前まとめLINE" : "") +
                (hasBedtimeSendLock && hasThreeHoursSendLock ? "・" : "") +
                (hasThreeHoursSendLock ? "3時間後0単位LINE" : "") +
                "の送信中状態が前回の画面から残っています。送信結果を確認できないため、自動再送・自動完了は行いません。LINEの受信状況を確認してください。";
            warning.style.display = "block";
        }
        const recoveryButton = document.getElementById("recoverSendLockButton");
        if (recoveryButton) recoveryButton.style.display = "block";
    }
    if (data.date !== getToday() && completed.bedtime === true) {
        // 完了フラグだけでは、日次まとめLINEの送信成功を証明できない。
        // 通常の送信成功後リセットが中断された可能性があるため、データを消さず停止する。
        blockAppForStateProblem("前日の就寝前完了状態が残っています。まとめLINEの送信成否をこの画面だけでは確認できないため、データを消去せず操作を停止しました。LINE受信履歴を確認し、管理者に確認してください。");
        return;
    }
    if (data.date !== getToday() && completed.bedtime !== true) {
        localStorage.setItem("pendingBedtimeDate", data.date);
    }
    ["morning", "lunch", "threeHours", "dinner", "bedtime"].forEach(function(type) {
        const value = data[type];
        document.getElementById(type).value = value === null || value === undefined ? "" : String(value);
    });
    document.getElementById("lunchSpecial").checked = !!data.lunchSpecial;
    document.getElementById("dinnerSpecial").checked = !!data.dinnerSpecial;
    updateAll();
    applyJudgedResultVisibility();
    const latest = localStorage.getItem(LATEST_KEY);
    setLatestResult(latest);
    applyCompletedState();
}

    setLatestResult(currentType);
    localStorage.setItem(LATEST_KEY, currentType);
    if (currentType === "threeHours") {
        const dose = getDose("threeHours");
        if (dose === 0) {
            const bg = document.getElementById("threeHours").value.trim();
            localStorage.setItem("threeHoursJudgedAt", Date.now().toString());
            sendThreeHoursZeroNotification();
        }
    }
    if (currentType === "bedtime") {
        const dose = getCurrentDose("bedtime");
        if (dose === 0) sendDailySummaryForBedtimeZero();
        else {
            localStorage.removeItem("bedtimeJudgedAt");
            const times = getCompletionTimes(); delete times.bedtime;
            localStorage.setItem(COMPLETION_TIMES_KEY, JSON.stringify(times));
        }
    }
    saveData();
    applyCompletedState();
    if (isLowBloodSugarResult(currentType)) confirmation.style.display = "block";
    else confirmation.style.display = "none";
});
function checkTresibaTime() {
    const threeHoursResult = document.getElementById("threeHoursResult");
    const tresibaResult = document.querySelector("#tresibaResult");
    if (!threeHoursResult || !tresibaResult) return;
    if (!isThreeHoursStageFinished()) return;
    const doseElement = threeHoursResult.querySelector(".result-dose");
    if (!doseElement || threeHoursResult.style.display === "none") return;
    const now = new Date();
    const minutes = now.getHours() * 60 + now.getMinutes();
    const transitionDate = localStorage.getItem("tresibaTransitionDate");
    const today = getToday();
    if (minutes < 17 * 60 + 45 || transitionDate === today) return;
    tresibaResult.classList.add("latest-result");
    localStorage.setItem(LATEST_KEY, "tresiba");
    localStorage.setItem("tresibaTransitionDate", today);
    const tresibaButton = document.querySelector('.injection-complete[data-type="tresiba"]');
    if (tresibaButton && tresibaButton.dataset.completed !== "true") tresibaButton.style.display = "block";
    tresibaResult.scrollIntoView({ behavior: "smooth", block: "center" });
}
setInterval(function() {
    applyThreeHoursTimeAdjustment();
    checkTresibaTime();
    if (isThreeHoursStageFinished()) {
        const completed = getCompletedSteps();
        if (!completed.threeHours) {
            saveCompletedStep("threeHours");
            saveCompletionTime("threeHours");
            const threeHoursInput = document.getElementById("threeHours");
            if (threeHoursInput) {
                threeHoursInput.disabled = true;
                const item = threeHoursInput.closest(".item");
                const confirmButton = item ? item.querySelector(".confirm-button") : null;
                if (confirmButton) confirmButton.disabled = true;
            }
            localStorage.removeItem("threeHoursJudgedAt");
            applyCompletedState();
        }
    }
    const bedtimeJudgedAt = localStorage.getItem("bedtimeJudgedAt");
    if (bedtimeJudgedAt && Date.now() - Number(bedtimeJudgedAt) >= 120000) {
        const input = document.getElementById("bedtime");
        const currentBg = input ? input.value.trim() : "";
        const currentDose = getCurrentDose("bedtime");
        const sentBg = localStorage.getItem("dailySummaryZeroSentBedtimeBg");
        const sendingBg = localStorage.getItem("dailySummaryZeroSendingBedtimeBg");
        if (currentDose === 0 && isCurrentJudgedInput("bedtime") && sentBg === currentBg && !sendingBg) {
            const completed = getCompletedSteps();
            if (!completed.bedtime) saveCompletedStep("bedtime");
            finishDayAndReset();
            return;
        }
    }
}, 5000);
checkTresibaTime();
/* ========================= 数値入力時に自動保存 ========================= */
document.querySelectorAll('input[type="number"]').forEach(function(input) {
    input.addEventListener("input", function() {
        if (appStateBlocked) return;
        const type = input.id;
        invalidateJudgement(type);
        saveData();
        applyCompletedState();
    });
});
/* ========================= チェックボックス変更時に保存 ========================= */
document.getElementById("lunchSpecial").addEventListener("change", function() {
    if (appStateBlocked) return;
    invalidateJudgement("lunch");
    saveData();
    applyCompletedState();
});
document.getElementById("dinnerSpecial").addEventListener("change", function() {
    if (appStateBlocked) return;
    invalidateJudgement("dinner");
    saveData();
    applyCompletedState();
});
/* ========================= ページを開いたとき ========================= */
loadData();

/* 送信中状態が再読み込み後に残った場合の手動復旧。受信未着を確認した場合だけ解除する */
document.getElementById("recoverSendLockButton").addEventListener("click", function() {
    const confirmed = confirm(
        "LINEの該当通知が届いていないことを受信履歴で確認しましたか？\n\n" +
        "送信が成功していて通知が遅れている場合、再送すると重複する可能性があります。\n" +
        "未着を確認できた場合だけ「OK」を押してください。"
    );
    if (!confirmed) return;
    localStorage.removeItem("dailySummaryZeroSendingBedtimeBg");
    localStorage.removeItem(THREE_HOURS_ZERO_SENDING_KEY);
    const warning = document.getElementById("stateWarning");
    if (warning) { warning.textContent = "送信ロックを解除しました。該当段階の入力値を確認し、もう一度判定してください。"; warning.style.display = "block"; }
    this.style.display = "none";
    applyCompletedState();
});

/* ========================= 日付変更時の処理 ========================= */
setInterval(function() {
    if (appStateBlocked) return;
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    let data;
    try { data = JSON.parse(saved); }
    catch (error) { console.error("保存データの読み込みに失敗しました", error); return; }
    if (!data || typeof data !== "object" || !isValidDateKey(data.date)) {
        blockAppForStateProblem("日付変更確認時に保存データの形式が不正と判明しました。操作を停止しました。");
        return;
    }
    if (data.date !== getToday()) {
        const completed = getCompletedSteps();
        if (completed.bedtime !== true) {
            if (!localStorage.getItem("pendingBedtimeDate")) {
                localStorage.setItem("pendingBedtimeDate", data.date);
                location.reload();
            }
            return;
        }
        // 完了フラグだけを根拠に前日データを消去しない。
        // 送信成否の不明な日次まとめを失わないよう、管理者確認まで停止する。
        blockAppForStateProblem("前日の就寝前完了状態が残っています。まとめLINEの送信成否を確認できないため、データを消去せず操作を停止しました。LINE受信履歴を確認し、管理者に確認してください。");
        return;
    }
}, 60000);
</script>
