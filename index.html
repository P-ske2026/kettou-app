<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血糖管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f2;font-family:Arial,"Noto Sans JP",sans-serif;color:#222}
.container{max-width:600px;margin:0 auto;padding:15px}h1{text-align:center;font-size:34px;margin:10px 0 25px}
.item{background:white;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 2px 7px rgba(0,0,0,.10)}
.title{font-size:30px;font-weight:bold;margin-bottom:12px}.unit{font-size:18px;font-weight:normal;margin-left:5px}
input[type="number"]{width:100%;height:70px;font-size:36px;padding:10px 15px;border:3px solid #888;border-radius:12px;text-align:center}
input[type="number"]:focus{border-color:#333;outline:none}
.result{margin-top:15px;padding:12px 10px;text-align:center;background:#eee;border-radius:12px;font-size:24px;font-weight:bold}
.result-label{font-size:22px;font-weight:bold;margin-bottom:5px}.result-dose{font-size:42px;font-weight:bold}
.dose-number{font-size:42px}.check{margin-top:18px;padding:10px 5px;font-size:24px;font-weight:bold}
.check input{width:30px;height:30px;vertical-align:middle;margin-right:8px}
.fixed{background:#eee;padding:20px 10px;border-radius:12px;font-size:30px;text-align:center;font-weight:bold}
.notice{text-align:center;font-size:18px;margin-top:10px;color:#555}
.confirm-button{width:100%;height:70px;margin-top:15px;border:none;border-radius:12px;background:#333;color:white;font-size:28px;font-weight:bold}
.injection-complete{width:33%;min-width:150px;height:110px;margin-top:15px;margin-left:auto;margin-right:auto;display:block;border:none;border-radius:12px;background:#2e8b57;color:white;font-size:28px;font-weight:bold}
.confirmation{background:white;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 2px 7px rgba(0,0,0,.10)}
.confirmation-title{font-size:28px;font-weight:bold;text-align:center;margin-bottom:20px}
.confirmation-line{font-size:22px;padding:10px 5px;border-bottom:1px solid #ddd}
.calculate-button{width:100%;height:65px;margin-top:20px;border:none;border-radius:12px;background:#333;color:white;font-size:25px;font-weight:bold}
.back-button{width:100%;height:60px;margin-top:12px;border:2px solid #888;border-radius:12px;background:white;color:#222;font-size:23px;font-weight:bold}
.result.latest-result,.result.latest-result .result-dose,.fixed.latest-result,.fixed.latest-result .dose-number{color:red}
</style>
</head>
<body>
<div class="container">
<h1>今日の血糖値</h1>
<div class="item">
<div class="title">朝 <span class="unit">血糖値（mg/dL）</span></div>
<input type="number" id="morning" placeholder="入力" min="0" max="1000" step="1">
<button class="confirm-button">入力内容を確認</button>
<div class="result" id="morningResult" style="display:none;">血糖値を入力してください</div>
</div>
<button class="injection-complete" data-type="morning" style="display:none;" onclick="completeInjection('morning')">注射完了</button>
<div class="item">
<div class="title">昼 <span class="unit">血糖値（mg/dL）</span></div>
<input type="number" id="lunch" placeholder="入力" min="0" max="1000" step="1">
<div class="check"><label><input type="checkbox" id="lunchSpecial">外食・丼・揚げ物</label></div>
<button class="confirm-button">入力内容を確認</button>
<div class="result" id="lunchResult" style="display:none;">血糖値を入力してください</div>
<button class="injection-complete" data-type="lunch" style="display:none;" onclick="completeInjection('lunch')">注射完了</button>
</div>
<div class="item">
<div class="title">3時間後 <span class="unit">血糖値（mg/dL）</span></div>
<input type="number" id="threeHours" placeholder="入力" min="0" max="1000" step="1">
<button class="confirm-button">入力内容を確認</button>
<div class="result" id="threeHoursResult" style="display:none;">血糖値を入力してください</div>
<button class="injection-complete" data-type="threeHours" style="display:none;" onclick="completeInjection('threeHours')">注射完了</button>
</div>
<div class="item">
<div class="title">18時</div>
<div class="fixed" id="tresibaResult">トレシーバ<br><span class="dose-number">7単位</span></div>
<button class="injection-complete" data-type="tresiba" style="display:none;" onclick="completeInjection('tresiba')">注射完了</button>
</div>
<div class="item">
<div class="title">夜 <span class="unit">血糖値（mg/dL）</span></div>
<input type="number" id="dinner" placeholder="入力" min="0" max="1000" step="1">
<div class="check"><label><input type="checkbox" id="dinnerSpecial">外食・丼・揚げ物</label></div>
<button class="confirm-button">入力内容を確認</button>
<div class="result" id="dinnerResult" style="display:none;">血糖値を入力してください</div>
<button class="injection-complete" data-type="dinner" style="display:none;" onclick="completeInjection('dinner')">注射完了</button>
</div>
<div class="item">
<div class="title">就寝前 <span class="unit">血糖値（mg/dL）</span></div>
<input type="number" id="bedtime" placeholder="入力" min="0" max="1000" step="1">
<button class="confirm-button">入力内容を確認</button>
<div class="result" id="bedtimeResult" style="display:none;">血糖値を入力してください</div>
<button class="injection-complete" data-type="bedtime" style="display:none;" onclick="completeInjection('bedtime')">注射完了</button>
</div>
<div id="confirmation" class="confirmation" style="display:none;">
<div class="confirmation-title">入力内容の確認</div><div id="confirmationText"></div>
<button id="calculateButton" class="calculate-button">この内容で判定する</button>
<button id="backButton" class="back-button">戻って修正する</button>
</div>
</div>
<script>
/* インスリン計算式は変更していません */
function calculate(type,value,special=false){
 if(value===""||value===null)return "血糖値を入力してください";
 const bg=Number(value);if(bg<70)return "計算対象外";let dose=0;
 if(bg<=249){if(type==="morning")dose=8;if(type==="lunch")dose=special?8:6;if(type==="threeHours")dose=0;if(type==="dinner")dose=special?9:7;if(type==="bedtime")dose=0}
 else if(bg<=299){if(type==="morning")dose=9;if(type==="lunch")dose=special?9:7;if(type==="threeHours")dose=0;if(type==="dinner")dose=special?10:8;if(type==="bedtime")dose=0}
 else if(bg<=349){if(type==="morning")dose=10;if(type==="lunch")dose=special?10:8;if(type==="threeHours")dose=1;if(type==="dinner")dose=special?11:9;if(type==="bedtime")dose=1}
 else if(bg<=399){if(type==="morning")dose=11;if(type==="lunch")dose=special?11:9;if(type==="threeHours")dose=2;if(type==="dinner")dose=special?12:10;if(type==="bedtime")dose=2}
 else if(bg<=449){if(type==="morning")dose=12;if(type==="lunch")dose=special?12:10;if(type==="threeHours")dose=3;if(type==="dinner")dose=special?13:11;if(type==="bedtime")dose=3}
 else if(bg<=499){if(type==="morning")dose=13;if(type==="lunch")dose=special?13:11;if(type==="threeHours")dose=4;if(type==="dinner")dose=special?14:12;if(type==="bedtime")dose=4}
 else {if(type==="morning")dose=14;if(type==="lunch")dose=special?14:12;if(type==="threeHours")dose=5;if(type==="dinner")dose=special?15:13;if(type==="bedtime")dose=5}
 return dose+"単位";
}
function updateAll(){const data={morning:document.getElementById("morning").value,lunch:document.getElementById("lunch").value,threeHours:document.getElementById("threeHours").value,dinner:document.getElementById("dinner").value,bedtime:document.getElementById("bedtime").value,lunchSpecial:document.getElementById("lunchSpecial").checked,dinnerSpecial:document.getElementById("dinnerSpecial").checked};showResult("morning",data.morning,false);showResult("lunch",data.lunch,data.lunchSpecial);showResult("threeHours",data.threeHours,false);showResult("dinner",data.dinner,data.dinnerSpecial);showResult("bedtime",data.bedtime,false)}
function showResult(type,value,special){
 const result=document.getElementById(type+"Result"),answer=calculate(type,value,special);
 if(answer==="血糖値を入力してください"){result.style.display="none";const button=document.querySelector('.injection-complete[data-type="'+type+'"]');if(button&&button.dataset.completed!=="true")button.style.display="none";return}
 let label="";if(type==="morning")label="朝のインスリン";if(type==="lunch")label="昼のインスリン";if(type==="threeHours")label="3時間後のインスリン";if(type==="dinner")label="夜のインスリン";if(type==="bedtime")label="就寝前のインスリン";
 result.innerHTML='<div class="result-label">'+label+'</div><div class="result-dose">'+answer+'</div>';result.style.display="block";
 if(type==="morning"||type==="lunch"){const button=document.querySelector('.injection-complete[data-type="'+type+'"]');if(button&&button.dataset.completed!=="true")button.style.display="block"}
 if(type==="threeHours"||type==="dinner"||type==="bedtime"){const button=document.querySelector('.injection-complete[data-type="'+type+'"]'),doseElement=result.querySelector(".result-dose");if(button&&doseElement&&button.dataset.completed!=="true"){const dose=parseInt(doseElement.textContent.trim(),10);if(dose>=1)button.style.display="block"}}
 const finalButton=document.querySelector('.injection-complete[data-type="'+type+'"]');if(finalButton&&finalButton.dataset.completed!=="true"){const doseElement=result.querySelector(".result-dose"),match=doseElement?doseElement.textContent.trim().match(/^(\d+)単位$/):null;if(!match||Number(match[1])===0)finalButton.style.display="none"}
}
function setLatestResult(type){document.querySelectorAll(".result").forEach(result=>result.classList.remove("latest-result"));if(!type)return;const result=document.getElementById(type+"Result");if(result)result.classList.add("latest-result")}
function restoreThreeHoursJudgedDose(){
 const savedDose=localStorage.getItem("threeHoursJudgedDose");
 const result=document.getElementById("threeHoursResult");
 if(!result||result.style.display==="none"||savedDose===null)return;
 const dose=Number(savedDose);
 if(!Number.isInteger(dose)||dose<0||dose>5)return;
 const doseElement=result.querySelector(".result-dose");
 if(doseElement)doseElement.textContent=dose+"単位";
 const button=document.querySelector('.injection-complete[data-type="threeHours"]');
 if(button&&button.dataset.completed!=="true")button.style.display=dose>=1?"block":"none";
}
const STORAGE_KEY="bloodSugarData",LATEST_KEY="latestBloodSugarResult",COMPLETED_KEY="completedSteps";
function getToday(){const now=new Date();return now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")}
// この画面を開いた日付を固定し、前日の古い画面が翌日の保存データを変更しないようにする。
const PAGE_DATE=getToday();
const DAY_STATE_KEY="bloodSugarAppDay";
// ページごとの識別子。再読み込み前のページが作った送信ロックだけを解除するために使う。
const PAGE_INSTANCE_ID=PAGE_DATE+"|"+Date.now()+"|"+Math.random().toString(36).slice(2);
function isCurrentPageDate(){return PAGE_DATE===getToday()}
function initializeDayState(){
 // 保存済みデータの日付を優先して確認し、日付管理キーが未作成という理由だけで当日データを消さない。
 const today=getToday();
 const knownDay=localStorage.getItem(DAY_STATE_KEY);
 const saved=localStorage.getItem(STORAGE_KEY);
 let savedDate=null,invalidSaved=false;
 if(saved){
  try{
   const data=JSON.parse(saved);
   savedDate=(typeof data.date==="string"&&data.date)?data.date:null;
  }catch(error){invalidSaved=true;}
 }
 // 明確に別日の日付が保存されている場合、または保存データ自体が壊れている場合だけ全日次状態を初期化。
 // DAY_STATE_KEYがない初回移行時でも、保存データが今日の日付なら維持する。
 const savedIsToday=savedDate===today;
 const savedIsOtherDay=!!savedDate&&savedDate!==today;
 const resetNeeded=invalidSaved||savedIsOtherDay||(!saved&&!!knownDay&&knownDay!==today)||(!savedDate&&!saved&&!!knownDay&&knownDay!==today);
 if(resetNeeded)clearDailyStorage();
 // 前日から残った送信中ロック、または期限切れのロックを回収する。
 const zeroSending=localStorage.getItem("dailySummaryZeroSendingBedtimeBg");
 if(zeroSending){
  const parts=zeroSending.split("|");
  const startedAt=Number(parts[2]);
  if(!zeroSending.startsWith(today+"|")||!Number.isFinite(startedAt)||Date.now()-startedAt>20000){
   localStorage.removeItem("dailySummaryZeroSendingBedtimeBg");
  }
 }
 const bedtimeSending=localStorage.getItem("dailySummaryBedtimeSendingDate");
 if(bedtimeSending&&!bedtimeSending.startsWith(today))localStorage.removeItem("dailySummaryBedtimeSendingDate");
 localStorage.setItem(DAY_STATE_KEY,today);
}
initializeDayState();
// 再読み込み・タブを閉じた際、当該ページが所有する送信ロックを解除する。
// 別タブが所有するロックはトークンが異なるため解除しない。
window.addEventListener("pagehide",function(){
 const key="dailySummaryZeroSendingBedtimeBg";
 const token=localStorage.getItem(key);
 if(token&&token.endsWith("|"+PAGE_INSTANCE_ID))localStorage.removeItem(key);
});
function savedDataMatchesDate(expectedDate){
 const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return true;
 try{const data=JSON.parse(saved);return !data.date||data.date===expectedDate}catch(error){console.error("保存データの日付確認に失敗しました",error);return false}
}
function clearDailyStorage(){
 [STORAGE_KEY,LATEST_KEY,COMPLETED_KEY,"tresibaTransitionDate","threeHoursZeroSentBg","threeHoursJudgedAt","threeHoursJudgedDose","dailySummaryZeroSentBedtimeBg","dailySummaryZeroSendingBedtimeBg","bedtimeJudgedAt","pendingBedtimeDate","dailySummaryBedtimeSentDate","dailySummaryBedtimeSendingDate"].forEach(key=>localStorage.removeItem(key));
}
function getCompletedSteps(){try{return JSON.parse(localStorage.getItem(COMPLETED_KEY))||{}}catch(e){return {}}}
function saveCompletedStep(type){if(!isCurrentPageDate())return;const completed=getCompletedSteps();completed[type]=true;localStorage.setItem(COMPLETED_KEY,JSON.stringify(completed))}
function finishDayAndReset(expectedDate=PAGE_DATE){
 if(!expectedDate||expectedDate!==PAGE_DATE||!isCurrentPageDate())return;
 if(!savedDataMatchesDate(expectedDate))return;
 clearDailyStorage();
 localStorage.setItem(DAY_STATE_KEY,getToday());
 location.reload();
}
function getDose(type){const result=document.getElementById(type+"Result");if(!result||result.style.display==="none")return null;const doseElement=result.querySelector(".result-dose");if(!doseElement)return null;const match=doseElement.textContent.match(/^(\d+)単位$/);if(!match)return null;return Number(match[1])}
function getCurrentDose(type){const input=document.getElementById(type);if(!input||input.value==="")return null;let special=false;if(type==="lunch")special=document.getElementById("lunchSpecial").checked;if(type==="dinner")special=document.getElementById("dinnerSpecial").checked;const answer=calculate(type,input.value,special);if(typeof answer!=="string")return null;const match=answer.match(/^(\d+)単位$/);if(!match)return null;let dose=Number(match[1]);if(type==="threeHours"){const now=new Date(),minutes=now.getHours()*60+now.getMinutes();if(minutes>=16*60+30){const bg=Number(input.value);dose=bg>=450?1:0}}return dose}
function buildDailySummaryPayload(){
 // まとめLINEは送信時刻から再計算せず、画面で判定・表示された投与量をそのまま使う。
 // これにより3時間後の16:30ルールが送信時刻によって変化しない。
 return {type:"dailySummary",morning:{bg:document.getElementById("morning").value,dose:getDose("morning")},lunch:{bg:document.getElementById("lunch").value,dose:getDose("lunch"),special:document.getElementById("lunchSpecial").checked},threeHours:{bg:document.getElementById("threeHours").value,dose:getDose("threeHours")},dinner:{bg:document.getElementById("dinner").value,dose:getDose("dinner"),special:document.getElementById("dinnerSpecial").checked},bedtime:{bg:document.getElementById("bedtime").value,dose:getDose("bedtime")}};
}
async function sendLineNotification(data){
 const controller=new AbortController();
 const timeoutId=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch("https://kettou-line.yts-bloom-style.workers.dev/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),signal:controller.signal});
  if(!response.ok){console.error("LINE通知エラー:",await response.text());return false}
  console.log("LINE通知送信成功");return true;
 }catch(error){console.error("LINE通知通信エラーまたはタイムアウト:",error);return false}
 finally{clearTimeout(timeoutId)}
}
function isThreeHoursStageFinished(){const completed=getCompletedSteps();if(completed.threeHours)return true;const judgedAt=localStorage.getItem("threeHoursJudgedAt");if(!judgedAt)return false;const dose=getDose("threeHours");if(dose!==0)return false;return Date.now()-Number(judgedAt)>=2*60*1000}
function applyCompletedState(){
 const completed=getCompletedSteps(),threeHoursFinished=isThreeHoursStageFinished(),unlocked={morning:true,lunch:!!completed.morning,threeHours:!!completed.lunch,dinner:!!completed.tresiba,bedtime:!!completed.dinner};
 Object.keys(unlocked).forEach(type=>{const input=document.getElementById(type);if(!input)return;const locked=!unlocked[type]||!!completed[type];input.disabled=locked;const item=input.closest(".item"),confirmButton=item?item.querySelector(".confirm-button"):null;if(confirmButton)confirmButton.disabled=locked});
 const lunchSpecial=document.getElementById("lunchSpecial");if(lunchSpecial)lunchSpecial.disabled=!unlocked.lunch||!!completed.lunch;const dinnerSpecial=document.getElementById("dinnerSpecial");if(dinnerSpecial)dinnerSpecial.disabled=!unlocked.dinner||!!completed.dinner;
 document.querySelectorAll(".injection-complete").forEach(button=>{const type=button.dataset.type;if(completed[type]){button.dataset.completed="true";button.style.display="none";return}button.dataset.completed="false";button.style.display="none";if(type==="tresiba"){const now=new Date(),minutes=now.getHours()*60+now.getMinutes();if(threeHoursFinished&&minutes>=17*60+45&&unlocked.threeHours)button.style.display="block";return}if(!unlocked[type])return;const dose=getDose(type);if(type==="morning"||type==="lunch"){if(dose!==null)button.style.display="block";return}if((type==="threeHours"||type==="dinner"||type==="bedtime")&&dose!==null&&dose>=1)button.style.display="block"})
}
function isStepCompleted(type){return getCompletedSteps()[type]===true}
function completeInjection(type){
 if(!isCurrentPageDate())return;
 if(type==="bedtime"&&getDose("bedtime")===0)return;
 saveCompletedStep(type);
 const button=document.querySelector('.injection-complete[data-type="'+type+'"]');if(button){button.dataset.completed="true";button.style.display="none"}
 const input=document.getElementById(type);if(input){input.disabled=true;const item=input.closest(".item"),confirmButton=item?item.querySelector(".confirm-button"):null;if(confirmButton)confirmButton.disabled=true}
 if(type==="morning"){sendLineNotification({type:"morning",bg:document.getElementById("morning").value,dose:getDose("morning")});const lunch=document.getElementById("lunch");if(lunch){lunch.focus();lunch.scrollIntoView({behavior:"smooth",block:"center"})}}
 else if(type==="lunch"){sendLineNotification({type:"lunch",bg:document.getElementById("lunch").value,dose:getDose("lunch"),special:document.getElementById("lunchSpecial").checked});const threeHours=document.getElementById("threeHours");if(threeHours){threeHours.focus();threeHours.scrollIntoView({behavior:"smooth",block:"center"})}}
 else if(type==="threeHours"){sendLineNotification({type:"threeHours",bg:document.getElementById("threeHours").value,dose:getDose("threeHours")});const threeHoursResult=document.getElementById("threeHoursResult"),tresibaResult=document.getElementById("tresibaResult");if(threeHoursResult)threeHoursResult.classList.remove("latest-result");if(tresibaResult)tresibaResult.classList.add("latest-result");localStorage.removeItem("threeHoursJudgedAt");const tresibaButton=document.querySelector('.injection-complete[data-type="tresiba"]');if(tresibaButton)tresibaButton.style.display="block";if(tresibaResult)tresibaResult.scrollIntoView({behavior:"smooth",block:"center"})}
 else if(type==="tresiba"){sendLineNotification({type:"tresiba"});const tresibaResult=document.getElementById("tresibaResult");if(tresibaResult)tresibaResult.classList.remove("latest-result");const dinner=document.getElementById("dinner");if(dinner){dinner.focus();dinner.scrollIntoView({behavior:"smooth",block:"center"})}}
 else if(type==="dinner"){sendLineNotification({type:"dinner",bg:document.getElementById("dinner").value,dose:getDose("dinner"),special:document.getElementById("dinnerSpecial").checked});const bedtime=document.getElementById("bedtime");if(bedtime){bedtime.focus();bedtime.scrollIntoView({behavior:"smooth",block:"center"})}}
 else if(type==="bedtime"){
  const dose=getDose("bedtime");
  if(dose>=1){
   const bedtimeDate=PAGE_DATE;
   sendLineNotification(buildDailySummaryPayload()).then(success=>{
    // 日付が変わった後に前日の送信結果が戻ってきた場合、
    // 翌日の完了状態や入力データには触れない
    if(!isCurrentPageDate()||!savedDataMatchesDate(bedtimeDate))return;
    if(success){
     finishDayAndReset(bedtimeDate);
    }else{
     const completed=getCompletedSteps();
     completed.bedtime=false;
     localStorage.setItem(COMPLETED_KEY,JSON.stringify(completed));
     alert("まとめLINEを送信できませんでした。通信状態を確認して、もう一度お試しください。");
     location.reload();
    }
   })
  }
  else return;
 }
 applyCompletedState()
}
async function sendDailySummaryForBedtimeZero(){
 if(!isCurrentPageDate())return;
 const operationDate=PAGE_DATE,input=document.getElementById("bedtime");
 if(!input||input.value.trim()==="")return;
 const sentKey="dailySummaryZeroSentBedtimeBg",sendingKey="dailySummaryZeroSendingBedtimeBg",judgedAtKey="bedtimeJudgedAt",dose=getCurrentDose("bedtime");
 if(dose!==0){localStorage.removeItem(judgedAtKey);return}
 if(!localStorage.getItem(judgedAtKey))localStorage.setItem(judgedAtKey,Date.now().toString());
 if(localStorage.getItem(sendingKey))return;
 let bg=input.value.trim();if(localStorage.getItem(sentKey)===bg)return;
 const sendingToken=operationDate+"|"+bg+"|"+Date.now()+"|"+PAGE_INSTANCE_ID;localStorage.setItem(sendingKey,sendingToken);
 try{
  while(true){
   if(!isCurrentPageDate()||!savedDataMatchesDate(operationDate))return;
   const currentBg=input.value.trim(),currentDose=getCurrentDose("bedtime");
   if(currentBg===""||currentDose!==0){localStorage.removeItem(judgedAtKey);break}
   if(localStorage.getItem(sentKey)===currentBg)break;
   bg=currentBg;
   const payload=buildDailySummaryPayload(),success=await sendLineNotification(payload);
   // 前日の通信結果で、翌日の送信済み状態や入力を変更しない。
   if(!isCurrentPageDate()||!savedDataMatchesDate(operationDate))return;
   if(!success){alert("就寝前のまとめLINEを送信できませんでした。通信状態を確認して、再度判定してください。");break}
   localStorage.setItem(sentKey,bg);
   if(input.value.trim()!==bg)continue;
   break;
  }
 }catch(error){
  if(isCurrentPageDate()&&savedDataMatchesDate(operationDate)){console.error("就寝前のまとめLINE送信エラー:",error);alert("就寝前のまとめLINE送信中にエラーが発生しました。通信状態を確認して、再度判定してください。")}
 }finally{
  // 古いタブが翌日の送信中フラグを消さないよう、自分のトークンだけ解除する。
  if(isCurrentPageDate()&&savedDataMatchesDate(operationDate)&&localStorage.getItem(sendingKey)===sendingToken)localStorage.removeItem(sendingKey);
 }
}
function saveData(){
 if(!isCurrentPageDate())return;
 const data={date:PAGE_DATE,morning:document.getElementById("morning").value,lunch:document.getElementById("lunch").value,threeHours:document.getElementById("threeHours").value,dinner:document.getElementById("dinner").value,bedtime:document.getElementById("bedtime").value,lunchSpecial:document.getElementById("lunchSpecial").checked,dinnerSpecial:document.getElementById("dinnerSpecial").checked};
 localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function loadData(){
 const saved=localStorage.getItem(STORAGE_KEY);
 if(!saved){
  clearDailyStorage();
  // ブラウザがフォーム値を復元しても、当日データがない場合は空の新しい日として開始する。
  ["morning","lunch","threeHours","dinner","bedtime"].forEach(id=>{
   const input=document.getElementById(id);if(input){input.value="";input.disabled=false;}
   const result=document.getElementById(id+"Result");if(result){result.style.display="none";result.classList.remove("latest-result");}
  });
  document.getElementById("lunchSpecial").checked=false;
  document.getElementById("dinnerSpecial").checked=false;
  document.querySelectorAll(".confirm-button").forEach(button=>button.disabled=false);
  document.querySelectorAll(".injection-complete").forEach(button=>{button.dataset.completed="false";button.style.display="none";});
  applyCompletedState();
  return;
 }
 let data;
 try{data=JSON.parse(saved)}catch(error){console.error("保存データの読み込みに失敗しました",error);clearDailyStorage();applyCompletedState();return}
 if(data.date!==PAGE_DATE||!isCurrentPageDate()){
  clearDailyStorage();
  document.getElementById("morning").value="";document.getElementById("lunch").value="";document.getElementById("threeHours").value="";document.getElementById("dinner").value="";document.getElementById("bedtime").value="";document.getElementById("lunchSpecial").checked=false;document.getElementById("dinnerSpecial").checked=false;applyCompletedState();return;
 }
 localStorage.removeItem("pendingBedtimeDate");
 document.getElementById("morning").value=data.morning||"";document.getElementById("lunch").value=data.lunch||"";document.getElementById("threeHours").value=data.threeHours||"";document.getElementById("dinner").value=data.dinner||"";document.getElementById("bedtime").value=data.bedtime||"";document.getElementById("lunchSpecial").checked=!!data.lunchSpecial;document.getElementById("dinnerSpecial").checked=!!data.dinnerSpecial;updateAll();restoreThreeHoursJudgedDose();setLatestResult(localStorage.getItem(LATEST_KEY));applyCompletedState();
}
document.querySelectorAll(".confirm-button").forEach(button=>button.addEventListener("click",function(){
 if(!isCurrentPageDate())return;
 const confirmation=document.getElementById("confirmation"),currentItem=button.closest(".item");let currentType="";
 if(currentItem.querySelector("#morning"))currentType="morning";else if(currentItem.querySelector("#lunch"))currentType="lunch";else if(currentItem.querySelector("#threeHours"))currentType="threeHours";else if(currentItem.querySelector("#dinner"))currentType="dinner";else if(currentItem.querySelector("#bedtime"))currentType="bedtime";
 confirmation.dataset.currentType=currentType;
 const morning=document.getElementById("morning").value,lunch=document.getElementById("lunch").value,threeHours=document.getElementById("threeHours").value,dinner=document.getElementById("dinner").value,bedtime=document.getElementById("bedtime").value,lunchSpecial=document.getElementById("lunchSpecial").checked,dinnerSpecial=document.getElementById("dinnerSpecial").checked;let text="";
 text+='<div class="confirmation-line">朝：'+(morning===""?"未入力":morning+" mg/dL")+'</div>';text+='<div class="confirmation-line">昼：'+(lunch===""?"未入力":lunch+" mg/dL")+(lunchSpecial?"（外食・丼・揚げ物）":"")+'</div>';text+='<div class="confirmation-line">3時間後：'+(threeHours===""?"未入力":threeHours+" mg/dL")+'</div>';text+='<div class="confirmation-line">18時：トレシーバ 7単位</div>';text+='<div class="confirmation-line">夜：'+(dinner===""?"未入力":dinner+" mg/dL")+(dinnerSpecial?"（外食・丼・揚げ物）":"")+'</div>';text+='<div class="confirmation-line">就寝前：'+(bedtime===""?"未入力":bedtime+" mg/dL")+'</div>';
 document.getElementById("confirmationText").innerHTML=text;button.parentNode.insertBefore(confirmation,button.nextSibling);confirmation.style.display="block";confirmation.scrollIntoView({behavior:"smooth",block:"center"})
}));
document.getElementById("calculateButton").addEventListener("click",function(){
 if(!isCurrentPageDate())return;
 const confirmation=document.getElementById("confirmation"),currentType=confirmation.dataset.currentType;
 const currentInput=document.getElementById(currentType);
 if(!currentInput||currentInput.value===""||!Number.isInteger(Number(currentInput.value))||Number(currentInput.value)<0||Number(currentInput.value)>1000){alert("血糖値を0～1000の整数で入力してください。");if(currentInput)currentInput.focus();return}
 updateAll();
 if(currentType==="threeHours"){
  const now=new Date(),minutes=now.getHours()*60+now.getMinutes(),cutoff=16*60+30;
  if(minutes>=cutoff){const bg=Number(document.getElementById("threeHours").value),result=document.getElementById("threeHoursResult"),doseElement=result.querySelector(".result-dose");if(doseElement){const dose=bg>=450?1:0;doseElement.textContent=dose+"単位"}}
  const judgedDose=getDose("threeHours");
  if(judgedDose!==null)localStorage.setItem("threeHoursJudgedDose",String(judgedDose));
}
 setLatestResult(currentType);localStorage.setItem(LATEST_KEY,currentType);
 if(currentType==="threeHours"){const dose=getDose("threeHours");if(dose===0){const bg=document.getElementById("threeHours").value.trim();localStorage.setItem("threeHoursJudgedAt",Date.now().toString());const sentBgKey="threeHoursZeroSentBg",lastSentBg=localStorage.getItem(sentBgKey);if(lastSentBg!==bg){localStorage.setItem(sentBgKey,bg);sendLineNotification({type:"threeHours",bg:bg,dose:dose}).then(success=>{if(isCurrentPageDate()&&!success&&localStorage.getItem(sentBgKey)===bg)localStorage.removeItem(sentBgKey)})}}}
 if(currentType==="bedtime"){const dose=getCurrentDose("bedtime");if(dose===0)sendDailySummaryForBedtimeZero();else localStorage.removeItem("bedtimeJudgedAt")}
 saveData();applyCompletedState();confirmation.style.display="none"
});
function checkTresibaTime(){
 if(!isCurrentPageDate())return;
 const threeHoursResult=document.getElementById("threeHoursResult"),tresibaResult=document.querySelector("#tresibaResult");if(!threeHoursResult||!tresibaResult)return;if(!isThreeHoursStageFinished())return;const doseElement=threeHoursResult.querySelector(".result-dose");if(!doseElement||threeHoursResult.style.display==="none")return;const now=new Date(),minutes=now.getHours()*60+now.getMinutes(),transitionDate=localStorage.getItem("tresibaTransitionDate"),today=getToday();if(minutes<17*60+45||transitionDate===today)return;tresibaResult.classList.add("latest-result");localStorage.setItem(LATEST_KEY,"tresiba");localStorage.setItem("tresibaTransitionDate",today);const tresibaButton=document.querySelector('.injection-complete[data-type="tresiba"]');if(tresibaButton&&tresibaButton.dataset.completed!=="true")tresibaButton.style.display="block";tresibaResult.scrollIntoView({behavior:"smooth",block:"center"})
}
setInterval(function(){
 if(!isCurrentPageDate())return;
 checkTresibaTime();
 if(isThreeHoursStageFinished()){const completed=getCompletedSteps();if(!completed.threeHours){saveCompletedStep("threeHours");const threeHoursInput=document.getElementById("threeHours");if(threeHoursInput){threeHoursInput.disabled=true;const item=threeHoursInput.closest(".item"),confirmButton=item?item.querySelector(".confirm-button"):null;if(confirmButton)confirmButton.disabled=true}localStorage.removeItem("threeHoursJudgedAt");applyCompletedState()}}
 const bedtimeJudgedAt=localStorage.getItem("bedtimeJudgedAt");
 if(bedtimeJudgedAt&&Date.now()-Number(bedtimeJudgedAt)>=120000){const input=document.getElementById("bedtime"),currentBg=input?input.value.trim():"",currentDose=getCurrentDose("bedtime"),sentBg=localStorage.getItem("dailySummaryZeroSentBedtimeBg"),sendingBg=localStorage.getItem("dailySummaryZeroSendingBedtimeBg");if(isCurrentPageDate()&&currentDose===0&&sentBg===currentBg&&!sendingBg&&savedDataMatchesDate(PAGE_DATE)){const completed=getCompletedSteps();if(!completed.bedtime)saveCompletedStep("bedtime");finishDayAndReset(PAGE_DATE);return}}
},5000);
checkTresibaTime();
document.querySelectorAll('input[type="number"]').forEach(input=>input.addEventListener("input",function(){if(!isCurrentPageDate())return;const type=input.id,result=document.getElementById(type+"Result");if(result){result.style.display="none";result.classList.remove("latest-result")}if(type==="threeHours"){localStorage.removeItem("threeHoursJudgedAt");localStorage.removeItem("threeHoursJudgedDose")}if(type==="bedtime")localStorage.removeItem("bedtimeJudgedAt");const button=document.querySelector('.injection-complete[data-type="'+type+'"]');if(button&&button.dataset.completed!=="true")button.style.display="none";saveData();applyCompletedState()}));
document.getElementById("lunchSpecial").addEventListener("change",function(){if(isCurrentPageDate())saveData()});document.getElementById("dinnerSpecial").addEventListener("change",function(){if(isCurrentPageDate())saveData()});
loadData();
function checkDayRollover(){
 const today=getToday();
 if(!isCurrentPageDate()){
  // 古いタブは今日のデータを消さない。新しい日付状態は新しいページ側が初期化する。
  location.reload();
  return;
 }
 const knownDay=localStorage.getItem(DAY_STATE_KEY);
 if(knownDay&&knownDay!==today){
  clearDailyStorage();
  localStorage.setItem(DAY_STATE_KEY,today);
  location.reload();
  return;
 }
 const saved=localStorage.getItem(STORAGE_KEY);
 if(saved){
  try{
   const data=JSON.parse(saved);
   if(data.date&&data.date!==today){
    clearDailyStorage();
    localStorage.setItem(DAY_STATE_KEY,today);
    location.reload();
   }
  }catch(error){
   console.error("保存データの日付確認に失敗しました",error);
   clearDailyStorage();
   localStorage.setItem(DAY_STATE_KEY,today);
   location.reload();
  }
 }
}
setInterval(checkDayRollover,5000);
window.addEventListener("pageshow",checkDayRollover);
</script>
