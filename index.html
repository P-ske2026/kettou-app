<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血糖管理</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, "Noto Sans JP", sans-serif;

    }

        margin: 0 auto;

    h1 {

    input[type="number"]:focus {

   .result {
    margin-top: 15px;
    padding: 12px 10px;

    background: #eeeeee;
    border-radius: 12px;
    font-size: 24px;
    font-weight: bold;
}

.result-label {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
}

.result-dose {
    font-size: 32px;
    font-weight: bold;
}

.result-label {
    font-size: 22px;
    margin-bottom: 5px;
}

.result-dose {
    font-size: 42px;
    font-weight: bold;
}

    .dose-number {
        font-size: 42px;
    }
.result-label {
    font-size: 22px;
    margin-bottom: 5px;
}

.result-dose {
    font-size: 42px;
    font-weight: bold;
}
    .check {
        margin-top: 18px;
        padding: 10px 5px;
        font-size: 24px;
        font-weight: bold;
    }

    .check input {
        width: 30px;
        height: 30px;
        vertical-align: middle;
        margin-right: 8px;

    .fixed {
        background: #eeeeee;
        padding: 20px 10px;
        border-radius: 12px;

    .notice {
        text-align: center;

    .confirm-button {

        height: 70px;
        margin-top: 15px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 28px;
        font-weight: bold;
    }
.injection-complete {
     width: 33%;
    min-width: 150px;
    height: 110px;
    margin-top: 15px;
    margin-left: auto;
    margin-right: auto;
    display: block;
    border: none;
    border-radius: 12px;
    background: #2e8b57;
    color: white;
    font-size: 28px;
    font-weight: bold;
}
    .confirmation {
        background: white;
        border-radius: 18px;
        padding: 20px;
        margin-top: 18px;
        box-shadow: 0 2px 7px rgba(0,0,0,0.10);
    }

    .confirmation-title {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
    }

    .confirmation-line {
        font-size: 22px;
        padding: 10px 5px;
        border-bottom: 1px solid #ddd;
    }

    .calculate-button {
        width: 100%;
        height: 65px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .back-button {
        width: 100%;
        height: 60px;
        margin-top: 12px;
        border: 2px solid #888;
        border-radius: 12px;
        background: white;
        color: #222;
        font-size: 23px;
        font-weight: bold;
    }
 /* 最新の判定結果 */
.result.latest-result {
    color: red;
}

.result.latest-result .result-dose {
    color: red;
}
.fixed.latest-result {
    color: red;
}

.fixed.latest-result .dose-number {
    color: red;
}
</style>

</head>

<body>

<div class="container">

    <h1>今日の血糖値</h1>

    <!-- 朝 -->
    <div class="item">
        <div class="title">
            朝 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="morning" placeholder="入力" min="0" max="1000" step="1">

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="morningResult" style="display:none;">
            血糖値を入力してください
        </div>
    </div>
    <button class="injection-complete" data-type="morning" style="display:none;" onclick="completeInjection('morning')">注射完了</button>

    <!-- 昼 -->
    <div class="item">
        <div class="title">
            昼 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="lunch" placeholder="入力" min="0" max="1000" step="1">

        <div class="check">
            <label>
                <input type="checkbox" id="lunchSpecial">
                外食・丼・揚げ物
            </label>
        </div>

        <button class="confirm-button">
            入力内容を確認
        </button>

        <div class="result" id="lunchResult" style="display:none;">
            血糖値を入力してください
        </div>
       <button class="injection-complete" data-type="lunch" style="display:none;" onclick="completeInjection('lunch')">注射完了</button>
    </div>


    <!-- 3時間後 -->
    <div class="item">
        <div class="title">
            3時間後 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="threeHours" placeholder="入力" min="0" max="1000" step="1">

        <button class="confirm-button">
            入力内容を確認
        </button>

       <div class="result" id="threeHoursResult" style="display:none;">
    血糖値を入力してください
</div>

<button class="injection-complete" data-type="threeHours" style="display:none;" onclick="completeInjection('threeHours')">
    注射完了
</button>
    </div>


    <!-- 18時 -->
<div class="item">
    <div class="title">18時</div>

    <div class="fixed" id="tresibaResult">
        トレシーバ<br>
        <span class="dose-number">7単位</span>
    </div>

  <button class="injection-complete" data-type="tresiba" style="display:none;" onclick="completeInjection('tresiba')">注射完了</button>
</div>


    <!-- 夜 -->
    <div class="item">
        <div class="title">
            夜 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="dinner" placeholder="入力" min="0" max="1000" step="1">

        <div class="check">
            <label>
                <input type="checkbox" id="dinnerSpecial">
                外食・丼・揚げ物
            </label>
        </div>

        <button class="confirm-button">
            入力内容を確認
        </button>

      <div class="result" id="dinnerResult" style="display:none;">
    血糖値を入力してください
</div>

<button class="injection-complete" data-type="dinner" style="display:none;"onclick="completeInjection('dinner')">
    注射完了
</button>
    </div>


    <!-- 就寝前 -->
    <div class="item">
        <div class="title">
            就寝前 <span class="unit">血糖値（mg/dL）</span>
        </div>

        <input type="number" id="bedtime" placeholder="入力" min="0" max="1000" step="1">

        <button class="confirm-button">
            入力内容を確認
        </button>

       <div class="result" id="bedtimeResult" style="display:none;">
    血糖値を入力してください
</div>

<button class="injection-complete" data-type="bedtime" style="display:none;" onclick="completeInjection('bedtime')">
    注射完了
</button>
    </div>


    <div id="confirmation" class="confirmation" style="display:none;">

        <div class="confirmation-title">
            入力内容の確認
        </div>

        <div id="confirmationText"></div>

        <button id="calculateButton" class="calculate-button">
            この内容で判定する
        </button>

        <button id="backButton" class="back-button">
            戻って修正する
        </button>

    </div>

</div>

<script>

/* =========================
   インスリン量の計算
   ========================= */

function calculate(type, value, special = false) {

    if (value === "" || value === null) {
        return "血糖値を入力してください";
    }

    const bg = Number(value);

    if (bg < 70) {
        return "計算対象外";
    }

    let dose = 0;

    if (bg <= 249) {
        if (type === "morning") dose = 8;
        if (type === "lunch") dose = special ? 8 : 6;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 9 : 7;
        if (type === "bedtime") dose = 0;

    } else if (bg <= 299) {
        if (type === "morning") dose = 9;
        if (type === "lunch") dose = special ? 9 : 7;
        if (type === "threeHours") dose = 0;
        if (type === "dinner") dose = special ? 10 : 8;
        if (type === "bedtime") dose = 0;

    } else if (bg <= 349) {
        if (type === "morning") dose = 10;
        if (type === "lunch") dose = special ? 10 : 8;
        if (type === "threeHours") dose = 1;
        if (type === "dinner") dose = special ? 11 : 9;
        if (type === "bedtime") dose = 1;

    } else if (bg <= 399) {
        if (type === "morning") dose = 11;
        if (type === "lunch") dose = special ? 11 : 9;
        if (type === "threeHours") dose = 2;
        if (type === "dinner") dose = special ? 12 : 10;
        if (type === "bedtime") dose = 2;

    } else if (bg <= 449) {
        if (type === "morning") dose = 12;
        if (type === "lunch") dose = special ? 12 : 10;
        if (type === "threeHours") dose = 3;
        if (type === "dinner") dose = special ? 13 : 11;
        if (type === "bedtime") dose = 3;

    } else if (bg <= 499) {
        if (type === "morning") dose = 13;
        if (type === "lunch") dose = special ? 13 : 11;
        if (type === "threeHours") dose = 4;
        if (type === "dinner") dose = special ? 14 : 12;
        if (type === "bedtime") dose = 4;

    } else {
        if (type === "morning") dose = 14;
        if (type === "lunch") dose = special ? 14 : 12;
        if (type === "threeHours") dose = 5;
        if (type === "dinner") dose = special ? 15 : 13;
        if (type === "bedtime") dose = 5;
    }

    return dose + "単位";
}


/* =========================
   結果表示
   ========================= */

function updateAll() {

    const data = {
        morning: document.getElementById("morning").value,
        lunch: document.getElementById("lunch").value,
        threeHours: document.getElementById("threeHours").value,
        dinner: document.getElementById("dinner").value,
        bedtime: document.getElementById("bedtime").value,
        lunchSpecial: document.getElementById("lunchSpecial").checked,
        dinnerSpecial: document.getElementById("dinnerSpecial").checked
    };


    showResult(
        "morning",
        data.morning,
        false
    );

    showResult(
        "lunch",
        data.lunch,
        data.lunchSpecial
    );

    showResult(
        "threeHours",
        data.threeHours,
        false
    );

    showResult(
        "dinner",
        data.dinner,
        data.dinnerSpecial
    );

    showResult(
        "bedtime",
        data.bedtime,
        false
    );
}

function showResult(type, value, special) {

    const result =
        document.getElementById(type + "Result");

    const answer =
        calculate(type, value, special);


    if (answer === "血糖値を入力してください") {

        result.style.display = "none";
        return;
    }


    let label = "";

    if (type === "morning") {
        label = "朝のインスリン";
    }

    if (type === "lunch") {
        label = "昼のインスリン";
    }

    if (type === "threeHours") {
        label = "3時間後のインスリン";
    }

    if (type === "dinner") {
        label = "夜のインスリン";
    }

    if (type === "bedtime") {
        label = "就寝前のインスリン";
    }


    result.innerHTML =
        '<div class="result-label">' +
        label +
        '</div>' +
        '<div class="result-dose">' +
        answer +
        '</div>';

    result.style.display = "block";


    /* =========================
       朝・昼
       ========================= */

    if (type === "morning" || type === "lunch") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="' +
                type +
                '"]'
            );

        if (
            button &&
            button.dataset.completed !== "true"
        ) {
            button.style.display = "block";
        }
    }


    /* =========================
       3時間後
       1単位以上なら完了ボタン
       ========================= */

    if (type === "threeHours") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="threeHours"]'
            );

        const doseElement =
            result.querySelector(".result-dose");

        if (
            button &&
            doseElement &&
            button.dataset.completed !== "true"
        ) {

            const dose =
                parseInt(
                    doseElement.textContent.trim(),
                    10
                );

            if (dose >= 1) {
                button.style.display = "block";
            }
        }
    }


    /* =========================
       夜
       1単位以上なら完了ボタン
       ========================= */

    if (type === "dinner") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="dinner"]'
            );

        const doseElement =
            result.querySelector(".result-dose");

        if (
            button &&
            doseElement &&
            button.dataset.completed !== "true"
        ) {

            const dose =
                parseInt(
                    doseElement.textContent.trim(),
                    10
                );

            if (dose >= 1) {
                button.style.display = "block";
            }
        }
    }


    /* =========================
       就寝前
       1単位以上なら完了ボタン
       ========================= */

    if (type === "bedtime") {

        const button =
            document.querySelector(
                '.injection-complete[data-type="bedtime"]'
            );

        const doseElement =
            result.querySelector(".result-dose");

        if (
            button &&
            doseElement &&
            button.dataset.completed !== "true"
        ) {

            const dose =
                parseInt(
                    doseElement.textContent.trim(),
                    10
                );

            if (dose >= 1) {
                button.style.display = "block";
            }
        }
       
    }

}
/* =========================
   最新の結果を赤字にする
   ========================= */

function setLatestResult(type) {

    document.querySelectorAll(".result").forEach(function(result) {
        result.classList.remove("latest-result");
    });


    if (!type) {
        return;
    }


    const result =
        document.getElementById(type + "Result");

    if (result) {
        result.classList.add("latest-result");
    }
}


/* =========================
   データ保存
   ========================= */

const STORAGE_KEY = "bloodSugarData";
const LATEST_KEY = "latestBloodSugarResult";
const COMPLETED_KEY = "completedSteps";

function getCompletedSteps() {
    try {
        return JSON.parse(localStorage.getItem(COMPLETED_KEY)) || {};
    } catch (e) {
        return {};
    }
}

function saveCompletedStep(type) {
    const completed = getCompletedSteps();
    completed[type] = true;
    localStorage.setItem(COMPLETED_KEY, JSON.stringify(completed));
}

function completeInjection(type) {

    /* =========================
       完了状態を保存
       ========================= */

    saveCompletedStep(type);


    /* =========================
       ボタンを完了済みにする
       ========================= */

    const button =
        document.querySelector(
            '.injection-complete[data-type="' + type + '"]'
        );

    if (button) {
        button.dataset.completed = "true";
        button.style.display = "none";
    }


    /* =========================
       入力欄をロック
       ========================= */

    const input =
        document.getElementById(type);

    if (input) {

        input.disabled = true;

        const item =
            input.closest(".item");

        const confirmButton =
            item
                ? item.querySelector(".confirm-button")
                : null;

        if (confirmButton) {
            confirmButton.disabled = true;
        }
    }


    /* =========================
       LINE通知
       ========================= */

    /* 朝 → LINE送信 → 昼へ */

    if (type === "morning") {

        sendLineNotification({
            type: "morning",
            bg: document.getElementById("morning").value,
            dose: getDose("morning")
        });

        const lunch =
            document.getElementById("lunch");

        if (lunch) {
            lunch.focus();
            lunch.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }


    /* 昼 → LINE送信 → 3時間後へ */

    else if (type === "lunch") {

        sendLineNotification({
            type: "lunch",
            bg: document.getElementById("lunch").value,
            dose: getDose("lunch"),
            special:
                document.getElementById("lunchSpecial").checked
        });

        const threeHours =
            document.getElementById("threeHours");

        if (threeHours) {
            threeHours.focus();
            threeHours.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }


    /* 3時間後 → LINE送信 → トレシーバへ */

    else if (type === "threeHours") {

        sendLineNotification({
            type: "threeHours",
            bg: document.getElementById("threeHours").value,
            dose: getDose("threeHours")
        });

        const threeHoursResult =
            document.getElementById("threeHoursResult");

        const tresibaResult =
            document.getElementById("tresibaResult");

        if (threeHoursResult) {
            threeHoursResult.classList.remove("latest-result");
        }

        if (tresibaResult) {
            tresibaResult.classList.add("latest-result");
        }

        localStorage.removeItem("threeHoursJudgedAt");

        const tresibaButton =
            document.querySelector(
                '.injection-complete[data-type="tresiba"]'
            );

        if (tresibaButton) {
            tresibaButton.style.display = "block";
        }

        if (tresibaResult) {
            tresibaResult.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }


    /* トレシーバ → LINE送信 → 夜へ */

    else if (type === "tresiba") {

        sendLineNotification({
            type: "tresiba"
        });

        const tresibaResult =
            document.getElementById("tresibaResult");

        if (tresibaResult) {
            tresibaResult.classList.remove("latest-result");
        }

        const dinner =
            document.getElementById("dinner");

        if (dinner) {
            dinner.focus();
            dinner.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }


    /* 夜 → LINE送信 → 就寝前へ */

    else if (type === "dinner") {

        sendLineNotification({
            type: "dinner",
            bg: document.getElementById("dinner").value,
            dose: getDose("dinner"),
            special:
                document.getElementById("dinnerSpecial").checked
        });

        const bedtime =
            document.getElementById("bedtime");

        if (bedtime) {
            bedtime.focus();
            bedtime.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }


    /* 就寝前 → 1日まとめLINE → 1日終了 */

    else if (type === "bedtime") {

        sendLineNotification(
            buildDailySummaryPayload()
        );

        location.reload();
    }


    /* =========================
       次の段階を解禁
       ========================= */

    applyCompletedState();
}

function isThreeHoursStageFinished() {
    const completed = getCompletedSteps();

    // 通常の「注射完了」
    if (completed.threeHours) {
        return true;
    }

    // 3時間後が0単位の場合
    // 判定から2分経過したら自動的にこの段階を終了扱いにする
    const judgedAt =
        localStorage.getItem("threeHoursJudgedAt");

    if (!judgedAt) {
        return false;
    }

    const dose = getDose("threeHours");

    if (dose !== 0) {
        return false;
    }

    return (
        Date.now() - Number(judgedAt)
        >= 2 * 60 * 1000
    );
}


function applyCompletedState() {

    const completed = getCompletedSteps();

    /*
     * 次に進める段階
     *
     * 朝 → 昼 → 3時間後 → トレシーバ → 夜 → 就寝前
     */

    const threeHoursFinished =
        isThreeHoursStageFinished();

    const unlocked = {
        morning: true,
        lunch: !!completed.morning,
        threeHours: !!completed.lunch,
        dinner: !!completed.tresiba,
        bedtime: !!completed.dinner
    };


    /*
     * 血糖値入力欄と「入力内容を確認」ボタンを
     * 現在の段階以降はロックする
     */

    Object.keys(unlocked).forEach(function(type) {

        const input =
            document.getElementById(type);

        if (input) {
            input.disabled =
                !unlocked[type] ||
                !!completed[type];

            const item =
                input.closest(".item");

            const confirmButton =
                item ?
                item.querySelector(".confirm-button") :
                null;

            if (confirmButton) {
                confirmButton.disabled =
                    !unlocked[type] ||
                    !!completed[type];
            }
        }
    });


    /*
     * 昼・夜の特殊チェックボックスも
     * その段階になるまで操作不可
     */

    const lunchSpecial =
        document.getElementById("lunchSpecial");

    if (lunchSpecial) {
        lunchSpecial.disabled =
            !unlocked.lunch ||
            !!completed.lunch;
    }


    const dinnerSpecial =
        document.getElementById("dinnerSpecial");

    if (dinnerSpecial) {
        dinnerSpecial.disabled =
            !unlocked.dinner ||
            !!completed.dinner;
    }


    /*
     * 「注射完了」ボタン
     *
     * まだ到達していない段階のボタンは表示しない
     */

    document.querySelectorAll(
        ".injection-complete"
    ).forEach(function(button) {

        const type =
            button.dataset.type;

        // すでに完了済み
        if (completed[type]) {
            button.dataset.completed = "true";
            button.style.display = "none";
            return;
        }


        // 18時トレシーバ
        // 3時間後が終了していて、17:45以降の場合だけ表示
        if (type === "tresiba") {

            const now = new Date();

            const minutes =
                now.getHours() * 60 + now.getMinutes();

            const tresibaTime =
                17 * 60 + 45;

            if (
                !threeHoursFinished ||
                minutes < tresibaTime
            ) {
                button.style.display = "none";
            }

            return;
        }


        // まだ到達していない段階
        if (
            unlocked[type] === false ||
            unlocked[type] === undefined
        ) {
            button.style.display = "none";
        }
    });
}/*
   =========================
   LINE通知
   ========================= */

async function sendLineNotification(data) {

    try {

        const response = await fetch(
            "https://kettou-line.yts-bloom-style.workers.dev/notify",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );

        if (!response.ok) {

            console.error(
                "LINE通知エラー:",
                await response.text()
            );

            return false;
        }

        console.log("LINE通知送信成功");

        return true;

    } catch (error) {

        console.error(
            "LINE通知通信エラー:",
            error
        );

        return false;
    }
}
/* =========================
   インスリン量を取得
   ========================= */

function getDose(type) {

    const result =
        document.getElementById(type + "Result");

    if (!result) {
        return null;
    }

    const doseElement =
        result.querySelector(".result-dose");

    if (!doseElement) {
        return null;
    }

    const match =
        doseElement.textContent.match(/\d+/);

    if (!match) {
        return null;
    }

    return Number(match[0]);
}

/* 現在入力されている血糖値から、その場で単位数を再計算する
   （表示中の古い判定結果を使わない） */
function getCurrentDose(type) {

    const input = document.getElementById(type);

    if (!input || input.value === "") {
        return null;
    }

    let special = false;

    if (type === "lunch") {
        special = document.getElementById("lunchSpecial").checked;
    }

    if (type === "dinner") {
        special = document.getElementById("dinnerSpecial").checked;
    }

    const answer = calculate(type, input.value, special);

    if (typeof answer !== "string") {
        return null;
    }

    const match = answer.match(/^(\d+)単位$/);

    if (!match) {
        return null;
    }

    return Number(match[1]);
}

function isStepCompleted(type) {
    const completed = getCompletedSteps();
    return completed[type] === true;
}
 /* =========================
    1日分のLINE通知データ
    ========================= */

function buildDailySummaryPayload() {

    return {

        type: "dailySummary",

        morning: {
            bg: document.getElementById("morning").value,
            dose: getCurrentDose("morning")
        },

        lunch: {
            bg: document.getElementById("lunch").value,
            dose: getCurrentDose("lunch"),
            special: document.getElementById("lunchSpecial").checked
        },

        threeHours: {
            bg: document.getElementById("threeHours").value,
            dose: getCurrentDose("threeHours")
        },

        dinner: {
            bg: document.getElementById("dinner").value,
            dose: getCurrentDose("dinner"),
            special: document.getElementById("dinnerSpecial").checked
        },

        bedtime: {
            bg: document.getElementById("bedtime").value,
            dose: getCurrentDose("bedtime")
        }
    };
}
   function getToday() {

    const now = new Date();

    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
}


function saveData() {

    const data = {

        date: getToday(),

        morning:
            document.getElementById("morning").value,

        lunch:
            document.getElementById("lunch").value,

        threeHours:
            document.getElementById("threeHours").value,

        dinner:
            document.getElementById("dinner").value,

        bedtime:
            document.getElementById("bedtime").value,

        lunchSpecial:
            document.getElementById("lunchSpecial").checked,

        dinnerSpecial:
            document.getElementById("dinnerSpecial").checked
    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================
   今日のデータを復元
   ========================= */

function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        applyCompletedState();
        return;
    }


    const data =
        JSON.parse(saved);


    /* 日付が変わっていたらリセット */

    if (data.date !== getToday()) {

        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LATEST_KEY);
        localStorage.removeItem(COMPLETED_KEY);
        localStorage.removeItem("tresibaTransitionDate");

        document.getElementById("morning").value = "";
        document.getElementById("lunch").value = "";
        document.getElementById("threeHours").value = "";
        document.getElementById("dinner").value = "";
        document.getElementById("bedtime").value = "";

        document.getElementById("lunchSpecial").checked = false;
        document.getElementById("dinnerSpecial").checked = false;

        return;
    }


    /* 今日なら復元 */

    document.getElementById("morning").value =
        data.morning || "";

    document.getElementById("lunch").value =
        data.lunch || "";

    document.getElementById("threeHours").value =
        data.threeHours || "";

    document.getElementById("dinner").value =
        data.dinner || "";

    document.getElementById("bedtime").value =
        data.bedtime || "";

    document.getElementById("lunchSpecial").checked =
        data.lunchSpecial || false;

    document.getElementById("dinnerSpecial").checked =
        data.dinnerSpecial || false;


    updateAll();


    /* 最後に判定した時間帯を赤字にする */

    const latest =
        localStorage.getItem(LATEST_KEY);

    setLatestResult(latest);
    applyCompletedState();
}

/* =========================
   入力内容を確認
   ========================= */

document.querySelectorAll(".confirm-button").forEach(function(button) {

    button.addEventListener("click", function() {

        const confirmation =
            document.getElementById("confirmation");

        const currentItem =
            button.closest(".item");

        let currentType = "";

        if (currentItem.querySelector("#morning")) {
            currentType = "morning";

        } else if (currentItem.querySelector("#lunch")) {
            currentType = "lunch";

        } else if (currentItem.querySelector("#threeHours")) {
            currentType = "threeHours";

        } else if (currentItem.querySelector("#dinner")) {
            currentType = "dinner";

        } else if (currentItem.querySelector("#bedtime")) {
            currentType = "bedtime";
        }

        confirmation.dataset.currentType =
            currentType;


        const morning =
            document.getElementById("morning").value;

        const lunch =
            document.getElementById("lunch").value;

        const threeHours =
            document.getElementById("threeHours").value;

        const dinner =
            document.getElementById("dinner").value;

        const bedtime =
            document.getElementById("bedtime").value;

        const lunchSpecial =
            document.getElementById("lunchSpecial").checked;

        const dinnerSpecial =
            document.getElementById("dinnerSpecial").checked;


        let text = "";


        text +=
            '<div class="confirmation-line">朝：' +
            (morning === ""
                ? "未入力"
                : morning + " mg/dL") +
            '</div>';


        text +=
            '<div class="confirmation-line">昼：' +
            (lunch === ""
                ? "未入力"
                : lunch + " mg/dL") +
            (lunchSpecial
                ? "（外食・丼・揚げ物）"
                : "") +
            '</div>';


        text +=
            '<div class="confirmation-line">3時間後：' +
            (threeHours === ""
                ? "未入力"
                : threeHours + " mg/dL") +
            '</div>';


        text +=
            '<div class="confirmation-line">18時：トレシーバ 7単位</div>';


        text +=
            '<div class="confirmation-line">夜：' +
            (dinner === ""
                ? "未入力"
                : dinner + " mg/dL") +
            (dinnerSpecial
                ? "（外食・丼・揚げ物）"
                : "") +
            '</div>';


        text +=
            '<div class="confirmation-line">就寝前：' +
            (bedtime === ""
                ? "未入力"
                : bedtime + " mg/dL") +
            '</div>';


        document.getElementById(
            "confirmationText"
        ).innerHTML = text;


        button.parentNode.insertBefore(
            confirmation,
            button.nextSibling
        );


        confirmation.style.display =
            "block";


        confirmation.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    });

});

/* =========================
   この内容で判定する
   ========================= */

document.getElementById("calculateButton").addEventListener(
    "click",
    function() {

        const confirmation =
            document.getElementById("confirmation");

        const currentType =
            confirmation.dataset.currentType;


        /* 判定 */

        updateAll();


        /* =========================
           3時間後の時間帯別補正
           ========================= */

        if (currentType === "threeHours") {

            const now = new Date();

            const minutes =
                now.getHours() * 60 + now.getMinutes();

            const cutoff =
                16 * 60 + 30;

            /*
             * 16:30以降の場合
             * 原則0単位
             * ただし血糖値450以上は1単位
             */

            if (minutes >= cutoff) {

                const bg =
                    Number(
                        document.getElementById(
                            "threeHours"
                        ).value
                    );

                const result =
                    document.getElementById(
                        "threeHoursResult"
                    );

                const doseElement =
                    result.querySelector(
                        ".result-dose"
                    );

                if (doseElement) {

                    const dose =
                        bg >= 450 ? 1 : 0;

                    doseElement.textContent =
                        dose + "単位";
                }
            }
        }


        /* 最新の時間帯を赤字にする */

        setLatestResult(currentType);


        /* 最新の時間帯を保存 */

        localStorage.setItem(
            LATEST_KEY,
            currentType
        );


        /* =========================
           3時間後 0単位
           2分タイマー開始
           ========================= */

        if (currentType === "threeHours") {

            const dose =
                getDose("threeHours");

            if (dose === 0) {

                localStorage.setItem(
                    "threeHoursJudgedAt",
                    Date.now().toString()
                );

                sendLineNotification({
                    type: "threeHours",
                    bg:
                        document.getElementById(
                            "threeHours"
                        ).value,
                    dose: dose
                });
            }
        }


        /* =========================
           就寝前 0単位
           1日まとめLINE
           ========================= */

        if (currentType === "bedtime") {

            const dose =
                getDose("bedtime");

            if (dose === 0) {

                sendLineNotification(
                    buildDailySummaryPayload()
                );
            }
        }


        /* 入力内容を保存 */

        saveData();


        /* 確認画面を閉じる */

        confirmation.style.display = "none";

    }
);
function checkTresibaTime() {

    const threeHoursResult =
        document.getElementById("threeHoursResult");

    const tresibaResult =
        document.querySelector("#tresibaResult");

    if (!threeHoursResult || !tresibaResult) {
        return;
    }

    /*
     * 3時間後が完了していなければ
     * トレシーバには進まない
     */
    if (!isThreeHoursStageFinished()) {
        return;
    }

    const doseElement =
        threeHoursResult.querySelector(".result-dose");

    if (!doseElement || threeHoursResult.style.display === "none") {
        return;
    }

    const now = new Date();
    const minutes =
        now.getHours() * 60 + now.getMinutes();

    const transitionDate =
        localStorage.getItem("tresibaTransitionDate");

    const today =
        getToday();

    /*
     * 17:45前、または今日すでに移行済みなら何もしない
     */
    if (
        minutes < 17 * 60 + 45 ||
        transitionDate === today
    ) {
        return;
    }

    /*
     * トレシーバを次の段階として表示
     */
    tresibaResult.classList.add("latest-result");

    localStorage.setItem(
        LATEST_KEY,
        "tresiba"
    );

    localStorage.setItem(
        "tresibaTransitionDate",
        today
    );

    const tresibaButton =
        document.querySelector(
            '.injection-complete[data-type="tresiba"]'
        );

    if (
        tresibaButton &&
        tresibaButton.dataset.completed !== "true"
    ) {
        tresibaButton.style.display = "block";
    }

    tresibaResult.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

setInterval(function() {

    checkTresibaTime();

    /* =========================
       3時間後 0単位
       2分経過で自動的に完了
       ========================= */

    if (isThreeHoursStageFinished()) {

        const completed =
            getCompletedSteps();

        if (!completed.threeHours) {

            saveCompletedStep("threeHours");

            
            const threeHoursInput =
                document.getElementById("threeHours");

            if (threeHoursInput) {

                threeHoursInput.disabled = true;

                const item =
                    threeHoursInput.closest(".item");

                const confirmButton =
                    item
                        ? item.querySelector(".confirm-button")
                        : null;

                if (confirmButton) {
                    confirmButton.disabled = true;
                }
            }

            /* 3時間後の判定時刻を解除 */
            localStorage.removeItem(
                "threeHoursJudgedAt"
            );

            /* トレシーバを解禁 */
            applyCompletedState();

            
                   }
    }

}, 5000);

checkTresibaTime();
/* =========================
   数値入力時に自動保存
   ========================= */

document.querySelectorAll(
    'input[type="number"]'
).forEach(function(input) {

    input.addEventListener(
        "input",
        function() {
            saveData();
        }
    );

});


/* =========================
   チェックボックス変更時に保存
   ========================= */

document.getElementById(
    "lunchSpecial"
).addEventListener(
    "change",
    saveData
);


document.getElementById(
    "dinnerSpecial"
).addEventListener(
    "change",
    saveData
);


/* =========================
   ページを開いたとき
   ========================= */

loadData();


/* =========================
   日付が変わったら自動リセット
   ========================= */

setInterval(function() {

    const saved =
        localStorage.getItem(STORAGE_KEY);


    if (!saved) {
        return;
    }


    const data =
        JSON.parse(saved);


    if (data.date !== getToday()) {

        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LATEST_KEY);
        localStorage.removeItem(COMPLETED_KEY);
        localStorage.removeItem("tresibaTransitionDate");

        location.reload();
    }

}, 60000);

</script>
